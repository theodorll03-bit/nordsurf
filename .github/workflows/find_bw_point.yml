name: Finn BarentsWatch-punkt

# Engangsverktøy (Theodors oppgave 05.10.2026 - se STATUS.md) - kjøres bare
# manuelt fra Actions-fanen, aldri på schedule. Henter BarentsWatch for et
# rutenett av kandidatpunkter rundt Unstad og Farstadsanden og committer
# resultatet til data/bw_point_search/, så det kan leses uten nøkler etterpå.
on:
  workflow_dispatch:
    inputs:
      spots:
        description: "Bare disse spots fra spots.json (komma, tom = alle)"
        required: false
        default: ""
      kandidater:
        description: "Spots fra spotfabrikken (data/kandidater/bygget/<id>.json, komma) - ROADMAP K del C"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  find_point:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Hent BarentsWatch for kandidatpunktene
        run: |
          if [ -n "$BW_SEARCH_KANDIDATER" ] || [ -n "$BW_SEARCH_SPOTS" ]; then
            export BW_SEARCH_OUT="result_$(date -u +%Y-%m-%dT%H%M)$( [ -n "$BW_SEARCH_KANDIDATER" ] && echo _kandidater ).json"
          fi
          python fetcher/find_bw_point.py
        env:
          BW_SEARCH_SPOTS: ${{ inputs.spots }}
          BW_SEARCH_KANDIDATER: ${{ inputs.kandidater }}
          UA_CONTACT: ${{ secrets.UA_CONTACT }}
          BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
          BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
          BW_POINT_URL: ${{ secrets.BW_POINT_URL }}
      - name: Lagre resultatet
        run: |
          git config user.name "nordsurf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bw_point_search/
          git diff --cached --quiet || git commit -m "Finn BarentsWatch-punkt: nytt søk"
          git push
