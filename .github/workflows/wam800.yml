name: WAM800 utforsk (ROADMAP oppgave J)

# Manuell utforsking av met.no sin WAM800-modell på thredds.met.no
# (OPeNDAP, bare punktene vi trenger). Skriver data/wam800/report.md og
# latest.json og committer dem til grenen workflowen kjøres fra. Kobler
# INGENTING inn i ratingen - se fetcher/wam800_explore.py.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy netCDF4
      - name: Utforsk WAM800
        run: python fetcher/wam800_explore.py
        env:
          UA_CONTACT: ${{ secrets.UA_CONTACT }}
      - name: Lagre rapporten
        run: |
          git config user.name "nordsurf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/wam800
          git diff --cached --quiet || git commit -m "WAM800-utforsking: ny rapport"
          git push
