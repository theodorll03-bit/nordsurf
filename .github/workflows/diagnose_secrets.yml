name: Diagnose secrets (finnes de for Actions?)

# 07.10.2026: etter at Theodor la inn APP_URL, NTFY_TOPIC, LOGS_REPO,
# LOGS_TOKEN og FROST_CLIENT_ID viste "Hent varsel" og "Vindmålinger" dem
# fortsatt som tomme, mens UA_CONTACT/BW_* er satt. Dette steget sier BARE
# om hvert navn finnes som repository-secret, eller som repository-VARIABEL
# (Settings → Secrets and variables → Actions har to faner) - aldri verdien.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Finnes navnene?
        run: |
          echo "navn | secret satt | variabel satt"
          echo "UA_CONTACT | ${{ secrets.UA_CONTACT != '' }} | ${{ vars.UA_CONTACT != '' }}"
          echo "BW_CLIENT_ID | ${{ secrets.BW_CLIENT_ID != '' }} | ${{ vars.BW_CLIENT_ID != '' }}"
          echo "APP_URL | ${{ secrets.APP_URL != '' }} | ${{ vars.APP_URL != '' }}"
          echo "NTFY_TOPIC | ${{ secrets.NTFY_TOPIC != '' }} | ${{ vars.NTFY_TOPIC != '' }}"
          echo "LOGS_REPO | ${{ secrets.LOGS_REPO != '' }} | ${{ vars.LOGS_REPO != '' }}"
          echo "LOGS_TOKEN | ${{ secrets.LOGS_TOKEN != '' }} | ${{ vars.LOGS_TOKEN != '' }}"
          echo "FROST_CLIENT_ID | ${{ secrets.FROST_CLIENT_ID != '' }} | ${{ vars.FROST_CLIENT_ID != '' }}"
