name: Vakthund

# Theodor 16.10.2026 (punkt 1b): sjekker hver 6. time (fotavtrykk 10.11.2026; før hver 3.), 1,5 t etter en
# «Hent varsel» (17 3-21/3), at varselet på live-siden er yngre enn 7 timer (10 over natthullet 21:17 → 03:17 UTC,
# fetcher/vakthund.py maks_alder) og at «Hent varsel» ikke har feilet to ganger på rad. Ellers åpner den en
# GitHub-issue «Varselet står stille» (eller kommenterer den åpne, høyst hver 6. time), og lukker den selv når
# varselet er ferskt igjen. ntfy i tillegg bare hvis NTFY_TOPIC finnes (tilstanden for det i actions/cache).
# Vakthunden committer aldri til main og rører ikke data/.
# Test: workflow_dispatch med «test_alder_timer» (virker bare utenfor main) later som varselet er så gammelt.
on:
  schedule:
    - cron: "47 4-22/6 * * *"   # 04:47, 10:47, 16:47, 22:47 UTC - 1,5 t etter «Hent varsel» kl. 03:17, 09:17, 15:17, 21:17
  workflow_dispatch:
    inputs:
      test_alder_timer:
        description: "TEST (bare utenfor main): lat som varselet er så mange timer gammelt"
        required: false
        default: ""

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  vakt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Hent tilstanden (sist varslet)
        uses: actions/cache/restore@v4
        with:
          path: vakthund_state.json
          key: vakthund-${{ github.run_id }}
          restore-keys: vakthund-
      - name: Sjekk varselet og «Hent varsel»
        run: timeout 120 python fetcher/vakthund.py vakthund_state.json
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/forecast.yml
          VAKTHUND_TEST_ALDER_T: ${{ github.ref != 'refs/heads/main' && inputs.test_alder_timer || '' }}
      - name: Lagre tilstanden
        if: always() && hashFiles('vakthund_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: vakthund_state.json
          key: vakthund-${{ github.run_id }}
