name: Vakthund

# Theodor 16.10.2026 (punkt 1b): sjekker hver 3. time, forskjøvet fra «Hent varsel» (17 */3), at varselet på
# live-siden er yngre enn 7 timer og at «Hent varsel» ikke har feilet to ganger på rad - ellers ett ntfy-varsel,
# høyst ett per 6 timer. Tilstanden (når det sist ble varslet) ligger i actions/cache, ikke i git: vakthunden
# skal aldri committe til main eller røre data/ (ingen konflikter med henterens commits, ingen støy i historikken).
# Uten NTFY_TOPIC: bare logget, som henteren.
on:
  schedule:
    - cron: "47 1-23/3 * * *"   # 01:47, 04:47 … - 1,5 t etter hver «Hent varsel» (17 */3)
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  vakt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Hent tilstanden (sist varslet)
        uses: actions/cache/restore@v4
        with:
          path: vakthund_state.json
          key: vakthund-${{ github.run_id }}
          restore-keys: vakthund-
      - name: Sjekk varselet og «Hent varsel»
        run: timeout 120 python fetcher/vakthund.py vakthund_state.json
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/forecast.yml
      - name: Lagre tilstanden
        if: always() && hashFiles('vakthund_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: vakthund_state.json
          key: vakthund-${{ github.run_id }}
