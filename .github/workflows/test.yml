name: Tester

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Hele historikken (Theodor 14.10.2026): test_display_only sammenligner
          # mot grenens felles utgangspunkt med main (merge-base). Med standard
          # dybde 1 fantes ikke den felles historikken i CI, merge-base feilet, og
          # testen sammenlignet mot main sin NYESTE commit - rødt på push-kjøringen
          # hver gang henteren hadde pushet et nytt varsel etter grenens siste synk
          # (PR #4, kjøring 38569044100). Hele repoet er ca. 110 MB (11 s å klone).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      # --with-deps installerer OS-biblitotekene Chromium trenger på
      # ubuntu-latest sin runner - uten dette feiler ofte selve
      # nettleser-oppstarten (ikke bare nedlastingen), ikke en overflødig flagg.
      - run: python -m playwright install --with-deps chromium
      - name: Test ratingen mot kjente dager
        run: python fetcher/test_rating.py
      - name: Test hele henteren uten nett
        run: python fetcher/test_pipeline.py
      - name: Test eksponering lært fra BarentsWatch (del B)
        run: python fetcher/test_exposure_learn.py
      - name: Test testlaben (backtest, uten nett)
        run: timeout 300 python fetcher/test_backtest.py
      - name: Sjekk at docs/sw.js sin cache-versjon stemmer med docs/
        run: python fetcher/test_docs_cache.py
      - name: Sjekk skivas kildetekst (treff/bom leser bare directness)
        run: python fetcher/test_map_disc.py
      - name: Test de delte datafilene (S2)
        run: python fetcher/test_publish.py
      - name: Ekte nettleser-test av skiva (Playwright)
        run: python fetcher/test_disc_browser.py
      - name: Designrunde 1 - bare visning (rating-/hentefiler og forecast.json lik main)
        run: |
          # uten --depth: en grunn henting av main ville kuttet den felles historikken igjen
          git fetch --no-tags origin main:refs/remotes/origin/main
          python fetcher/test_display_only.py
      - name: Kart først - nettleser-test av kartet, arket/panelet, spot, loggark, forklaring (Playwright + axe)
        run: timeout 330 python fetcher/test_design_browser.py
      - name: Last opp designskjermbilder (til feilsøking, selv om testen bestod)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-screenshots
          path: docs/design/oversikt/etter/
          if-no-files-found: ignore
      - name: Last opp skjermbilder (til feilsøking, selv om testen bestod)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disc-screenshots
          path: fetcher/test_screenshots/
          if-no-files-found: ignore
