name: Hent varsel

on:
  schedule:
    - cron: "17 */3 * * *"   # hver tredje time
  workflow_dispatch:          # kjør manuelt fra Actions-fanen

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Test ratingen mot kjente dager
        run: python fetcher/test_rating.py
      - name: Test hele henteren uten nett
        run: python fetcher/test_pipeline.py
      - name: Test eksponering lært fra BarentsWatch (del B)
        run: python fetcher/test_exposure_learn.py
      - name: Sjekk at docs/sw.js sin cache-versjon stemmer med docs/
        run: python fetcher/test_docs_cache.py
      - name: Sjekk skivas kildetekst (treff/bom leser bare directness)
        run: python fetcher/test_map_disc.py
      - name: Hent varsel, lær av logger og send varsler
        run: python fetcher/fetch.py
        timeout-minutes: 25
        env:
          UA_CONTACT: ${{ secrets.UA_CONTACT }}
          BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
          BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
          BW_POINT_URL: ${{ secrets.BW_POINT_URL }}
          LOGS_REPO: ${{ secrets.LOGS_REPO }}
          LOGS_TOKEN: ${{ secrets.LOGS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: ${{ secrets.APP_URL }}
          BW_DEBUG: ${{ vars.BW_DEBUG }}
      # ROADMAP oppgave G: si fra til Theodor hvis selve henteren (eller en
      # test før den) feilet - da kommer det ikke noe nytt varsel, og appen
      # viser bare at varselet er gammelt. Rent curl, ingen Python: skal
      # virke selv om pip install var det som feilet.
      - name: Varsle Theodor hvis kjøringen feilet
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -sS -H "Title: Nordsurf: henteren feilet" -H "Priority: high" -H "Tags: warning" \
              -H "Click: $RUN_URL" -d "Kjøringen feilet, ikke noe nytt varsel. Se loggen: $RUN_URL" \
              "https://ntfy.sh/$NTFY_TOPIC" || true
          fi
      - name: Lagre nytt varsel
        run: |
          git config user.name "nordsurf-bot"
          git config user.email "actions@users.noreply.github.com"
          # Hver for seg, ikke i én kommando: git add feiler atomisk hvis én
          # path mangler (f.eks. data/bw_calibration.json før den er skrevet
          # første gang), og da ble de andre filene aldri lagt til heller.
          git add docs/data/forecast.json
          git add data/notified.json 2>/dev/null || true
          git add data/bw_calibration.json 2>/dev/null || true
          # ROADMAP oppgave B: arkiv per kjøring (små filer) og målt treffsikkerhet
          git add -A data/forecast_archive 2>/dev/null || true
          git add data/forecast_accuracy.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Nytt varsel"
          # 07.10.2026: ta inn andres push under kjøringen (11 min) før push -
          # ellers "fetch first"-avvisning (sett i praksis da STATUS.md ble
          # pushet mens en manuell kjøring pågikk). Samme som de andre workflowene.
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
