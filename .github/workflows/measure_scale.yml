name: Mål skalering

on:
  workflow_dispatch:          # bare manuelt - planfase for «Skalering til mange spots» (ROADMAP)

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Mål svartid, svarstørrelse og bruksgrenser per kilde
        run: python fetcher/measure_scale.py
        timeout-minutes: 16
        env:
          UA_CONTACT: ${{ secrets.UA_CONTACT }}
          BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
          BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
          BW_POINT_URL: ${{ secrets.BW_POINT_URL }}
