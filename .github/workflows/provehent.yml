name: Prøvehenting (gren)

# Theodor 16.10.2026 (punkt 9c/d): første ekte varsel for nye spots FØR merge - henter varselet på en gren med
# kildenes nøkler, lager appens datafiler og laster dem opp som artifact «provevarsel» (7 dager). Committer
# ALDRI og publiserer ALDRI (ingen Pages, ingen læringsdata) - bare til gjennomgang og skjermbilder.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provehent:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Hent varselet (ingen varsler sendes)
        run: timeout 1500 python fetcher/fetch.py
        env:
          UA_CONTACT: ${{ secrets.UA_CONTACT }}
          BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
          BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
          BW_POINT_URL: ${{ secrets.BW_POINT_URL }}
      - name: Lag appens datafiler
        run: python fetcher/publish.py
      - uses: actions/upload-artifact@v4
        with:
          name: provevarsel
          path: |
            docs/data/oversikt.json
            docs/data/spots/
            docs/data/forecast.json
          retention-days: 7
