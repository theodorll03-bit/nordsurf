<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F3F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1B21" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Nordsurf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/map.css">
<style>
:root{
  --surface:#F1F3F2; --raised:#FFFFFF; --ink:#16252D; --muted:#52646C; --line:#D5DCDE;
  --star:#A86F08; --night:#DDE3E5; --selected:#16252D; --on-selected:#FFFFFF;
  /* Kart: grønt (vindu) og blått (vind) er faste valg. Svell er lilla, ikke
     blågrønn/turøs - det ville ligget for nært vindfargen for fargeblinde
     på det gråtonede kartet. Rav-gult (--star) er forbeholdt rating. */
  --window:#1E7A46; --window-fill:rgba(30,122,70,.16); --swell:#6D3FCE; --swell-miss:#8B98A0; --wind:#1C5FD6;
  --display:"Familjen Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body:system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  color-scheme: light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --surface:#0F1B21; --raised:#17262E; --ink:#E4EBED; --muted:#93A6AE; --line:#26363E;
    --star:#F2B544; --night:#0A1418; --selected:#E4EBED; --on-selected:#0F1B21;
    --window:#48C97C; --window-fill:rgba(72,201,124,.22); --swell:#B79CFF; --swell-miss:#7C8A92; --wind:#6FA8FF;
  }
}
:root[data-theme="dark"]{
  --surface:#0F1B21; --raised:#17262E; --ink:#E4EBED; --muted:#93A6AE; --line:#26363E;
  --star:#F2B544; --night:#0A1418; --selected:#E4EBED; --on-selected:#0F1B21;
  --window:#48C97C; --window-fill:rgba(72,201,124,.22); --swell:#B79CFF; --swell-miss:#7C8A92; --wind:#6FA8FF;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--surface);color:var(--ink);font:17px/1.4 var(--body);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--star);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 120px}

/* Sample-banner */
.sample{margin:12px 0 0;padding:10px 14px;border:1px dashed var(--muted);border-radius:10px;font-size:15px;color:var(--muted)}

/* Topp */
header.top{padding:20px 0 8px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 8px 0 0;background:none;border:0;color:var(--ink);font-size:17px;cursor:pointer}
h1{font:700 34px/1.1 var(--display);letter-spacing:-.01em;margin:4px 0 4px}
.sub{color:var(--muted);font-size:15px;margin:0}

/* Stjerner: signaturelementet */
.stars{display:inline-flex;gap:3px;vertical-align:middle}
.stars svg{width:22px;height:22px;display:block}
.stars.big svg{width:34px;height:34px}
.st-solid{fill:var(--star);stroke:var(--star);stroke-width:1.2}
.st-faded{fill:none;stroke:var(--star);stroke-width:1.6;stroke-dasharray:2.4 2;opacity:.8}
.st-empty{fill:none;stroke:var(--line);stroke-width:1.4}

/* Spotliste */
.list{margin:16px 0;background:var(--raised);border-radius:14px;overflow:hidden}
.spotrow{border-top:1px solid var(--line);position:relative}
.spotrow:first-child{border-top:0}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;padding:14px 54px 14px 16px;min-height:44px;background:none;border:0;cursor:pointer}
.row:active{background:var(--surface)}
.row .name{font:700 21px/1.2 var(--display)}
.row .area{color:var(--muted);font-size:15px}
.row .facts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:15px}
.row .best{grid-column:1/-1;font-size:15px}

/* Favoritt */
.fav-btn-wrap{position:absolute;top:6px;right:2px;z-index:1}
.fav-btn{all:unset;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}
.fav-btn svg{width:22px;height:22px;display:block}
.fav-outline{fill:none;stroke:var(--muted);stroke-width:1.5}
.fav-solid{fill:var(--star);stroke:var(--star)}
.fav-btn[aria-pressed="true"]{background:color-mix(in srgb,var(--star) 16%,transparent)}
@media (prefers-reduced-motion: no-preference){.fav-btn svg{transition:transform .15s ease}}
.fav-btn:active svg{transform:scale(.85)}
.spot-title-row{display:flex;align-items:center;gap:4px}
.spot-title-row h1{flex:1;min-width:0}

/* Kommende dager */
.daychips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 16px 14px}
.daychips::-webkit-scrollbar{display:none}
.daychip{all:unset;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:44px;padding:8px 10px;border-radius:12px;background:var(--surface);cursor:pointer;box-sizing:border-box}
.daychip .dc-day{font-size:12px;color:var(--muted);font-weight:600}
.daychip .stars svg{width:11px;height:11px}
.daychip .dc-h{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.daychip .dc-t{font-size:11px;color:var(--muted);white-space:nowrap}
.daychip.good{background:color-mix(in srgb,var(--star) 16%,var(--surface));outline:1.5px solid var(--star);outline-offset:-1.5px}
.daychip.anslag{opacity:.72}
.daychip.dark .dc-dark{font-size:13px;color:var(--muted);margin-top:6px}
.daychip:active{background:var(--line)}
.chev{color:var(--muted);font-size:22px;line-height:1}

/* Detalj */
.now{all:unset;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:14px 0 4px;cursor:pointer;min-height:44px}
.verdict{font-size:17px;margin:6px 0 0}
.warn{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;padding:12px 14px;background:var(--raised);border-radius:12px;font-size:15px}
.warn b{font-weight:600}

/* Timestripe med lys og mørke */
.strip-wrap{margin:20px -16px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.strip-wrap::-webkit-scrollbar{display:none}
.strip{display:flex;padding:0 16px;gap:0}
.day{display:flex;flex-direction:column;padding-right:10px}
.day-label{font-size:13px;color:var(--muted);height:20px;padding-left:2px;white-space:nowrap}
.hours{display:flex}
.h{width:30px;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;padding:6px 0 4px;background:none;border:0;cursor:pointer;border-radius:8px}
.h.dark{background:var(--night)}
.h.dusk{background:color-mix(in srgb,var(--night) 50%,transparent)}
.h.sel{background:var(--selected);color:var(--on-selected)}
.h.resmodel{opacity:.55}
.h.bw-break{border-left:2px dashed var(--muted);margin-left:2px;padding-left:4px}
.bar{width:14px;display:flex;flex-direction:column-reverse;gap:2px}
.pip{height:12px;border-radius:3px;background:var(--star)}
.pip.f{background:none;border:1.5px dashed var(--star)}
.pip.z{height:3px;background:var(--line)}
.h .hl{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.h.sel .hl{color:var(--on-selected)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Detaljgrid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:18px 0 0;background:var(--line);border-radius:14px;overflow:hidden}
.cell{background:var(--raised);padding:12px 14px}
.cell .k{font-size:13px;color:var(--muted)}
.cell .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.cell .n{font-size:13px;color:var(--muted);margin-top:2px}
.cell.wide{grid-column:1/-1}

/* Verktøylinje nederst */
.toolbar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.toolbar[hidden]{display:none}
.primary{pointer-events:auto;min-height:50px;padding:0 28px;border:0;border-radius:25px;background:var(--selected);color:var(--on-selected);font-weight:600;font-size:17px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.18)}

/* Tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
@media (prefers-reduced-transparency: reduce){nav.tabs{background:var(--surface);backdrop-filter:none}}
.tab{flex:0 1 160px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
body.has-tabs .toolbar{bottom:64px}

/* Ark (sheet) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--raised);border-radius:16px 16px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s}
.sheet.open{transform:none;visibility:visible;transition:transform .28s ease}
.scrim.open{display:block}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.sheet-head h2{font:700 20px/1.2 var(--display);margin:0}
.link{background:none;border:0;min-height:44px;padding:0 4px;color:var(--ink);font-size:17px;cursor:pointer}
.field{margin:18px 0 0}
.field > .lbl{font-size:15px;color:var(--muted);margin:0 0 8px}
.starpick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.starpick button{min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.starpick button b{font-size:20px;color:var(--ink)}
.starpick button[aria-pressed="true"]{border-color:var(--selected);background:var(--selected)}
.starpick button[aria-pressed="true"] b,.starpick button[aria-pressed="true"]{color:var(--on-selected)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px}
.chips button[aria-pressed="true"]{border-color:var(--selected);background:var(--selected);color:var(--on-selected)}
select,input[type="datetime-local"]{font:inherit;font-size:17px;min-height:44px;width:100%;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.save{width:100%;margin-top:24px}
.save:disabled{opacity:.4}
#bdScrim{z-index:40}
#bdSheet{z-index:41}
.breakdown{padding:4px 0 8px}
.breakdown .row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:16px}
.breakdown .row:first-child{border-top:0}
.breakdown .row.total{font-weight:700;border-top:2px solid var(--line);margin-top:4px}
.breakdown .row .lead{color:var(--ink)}
.breakdown .row .eff{color:var(--muted);flex:0 0 auto;text-align:right}

/* Logger */
h2.sec{font:700 22px/1.2 var(--display);margin:26px 0 8px}
.calib{background:var(--raised);border-radius:14px;padding:14px 16px;margin:0 0 10px}
.calib .t{font-weight:600}
.calib p{margin:4px 0 0;color:var(--muted);font-size:15px}
.logrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.logrow:first-child{border-top:0}
.logrow .m{color:var(--muted);font-size:15px;grid-column:1/-1}
.del{background:none;border:0;color:var(--muted);min-height:44px;min-width:44px;cursor:pointer;font-size:15px}
.empty{color:var(--muted);padding:18px 16px;margin:0}
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:var(--selected);color:var(--on-selected);padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.form{background:var(--raised);border-radius:14px;padding:14px 16px;margin:0 0 10px}
.form label{display:block;font-size:15px;color:var(--muted);margin:10px 0 6px}
.form input[type=text],.form input[type=password]{font:inherit;font-size:17px;min-height:44px;width:100%;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.form p{margin:6px 0 0;color:var(--muted);font-size:15px}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.ghost{background:none;border:1.5px solid var(--line);border-radius:22px;min-height:44px;padding:0 18px;cursor:pointer;font-size:15px}

/* Rapporter */
.reports{background:var(--raised);border-radius:14px;padding:0 16px;margin:0 0 24px}
.report{padding:12px 0;border-top:1px solid var(--line)}
.report:first-child{border-top:0}
.report-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.report-head b{font-size:15px}
.report-time{color:var(--muted);font-size:13px}
.report-del{all:unset;margin-left:auto;color:var(--muted);font-size:13px;cursor:pointer;min-height:44px;display:flex;align-items:center}
.report-extras{margin:4px 0 0;color:var(--muted);font-size:14px}
.report-text{margin:4px 0 0;font-size:15px;white-space:pre-wrap;overflow-wrap:break-word}
.report-form{padding:14px 0;border-top:1px solid var(--line)}
.reports > .report-form:first-child{border-top:0}
.report-form textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.report-form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.report-form-row label{font-size:14px;color:var(--muted)}
.report-form-row input[type=number]{font:inherit;font-size:16px;width:80px;min-height:40px;padding:0 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.report-form-row select{width:auto;min-height:40px}
</style>
</head>
<body class="has-tabs">
<main class="wrap" id="app" aria-live="polite"></main>
<div id="mapRoot" hidden></div>

<nav class="tabs" aria-label="Hovedmeny">

    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2 16c2.2 0 2.2-1.6 4.4-1.6S8.6 16 10.8 16s2.2-1.6 4.4-1.6S17.4 16 19.6 16 22 14.4 22 14.4V18c0 .2-.2 1.6-2.4 1.6s-2.2-1.6-4.4-1.6-2.2 1.6-4.4 1.6S8.6 18 6.4 18 4.2 19.6 2 19.6zM4 12.5C4 8.4 7.4 5 11.5 5c2.4 0 4.6 1.2 6 3-3-.8-6.2.6-7.5 3.5-.6 1.3-.8 2.4-.8 3.2-1.4-.5-3.3-.8-5.2-.9 0-.1 0-.2 0-.3z"/></svg>

<div class="toolbar" id="toolbar" hidden><button class="primary" id="logBtn">Logg økt</button></div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheet-head">
    <button class="link" id="cancelLog">Avbryt</button>
    <h2 id="sheetTitle">Logg økt</h2>
    <span style="width:60px"></span>
  </div>
  <div class="field"><p class="lbl">Spot</p><select id="logSpot"></select></div>
  <div class="field"><p class="lbl">Når</p><input type="datetime-local" id="logTime"></div>
  <div class="field"><p class="lbl">Hvor bra var det?</p><div class="starpick" id="starPick"></div></div>
  <div class="field"><p class="lbl">Størrelse (valgfritt)</p><div class="chips" data-group="size"></div></div>
  <div class="field"><p class="lbl">Vind (valgfritt)</p><div class="chips" data-group="wind"></div></div>
  <button class="primary save" id="saveLog" disabled>Lagre økt</button>
</section>
<div class="scrim" id="bdScrim"></div>
<section class="sheet" id="bdSheet" role="dialog" aria-modal="true" aria-labelledby="bdTitle" aria-hidden="true">
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheet-head">
    <span style="width:60px"></span>
    <h2 id="bdTitle">Hvorfor denne ratingen?</h2>
    <button class="link" id="bdClose">Lukk</button>
  </div>
  <div class="breakdown" id="bdBody"></div>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- Oppsett ---------- */
const TZ = "Europe/Oslo";
const LOG_KEY = "nordsurf.logs.v1";
const SIZES = ["Flatt","Knehøy","Hoftehøy","Brysthøy","Over hodet"];
const WINDS = ["Offshore","Onshore","Rotete","Blankt"];
const SIZE_M = {"Flatt":0, "Knehøy":0.5, "Hoftehøy":0.9, "Brysthøy":1.3, "Over hodet":2.0};
const MIN_SIZE_LOGS = 5;
const STAR_WORDS = ["Flatt","Dårlig","Ok","Bra","Veldig bra","Rått"];
const PICK_WORDS = ["Flatt","Dårlig","Ok","Bra","Topp","Rått"];
const WIND_WORD = {offshore:"offshore", side:"sidevind", sideonshore:"side-onshore", onshore:"onshore"};
function windLabel(h){
  // "blankt"/"nesten blankt" under 1,5/3 m/s, ellers vindtypen - se
  // fetcher/rating.py sin wind_label() (samme grenser, regnet ut server-side
  // for breakdown, men grid-cellen her trenger den uavhengig av breakdown).
  if(h.wind_speed==null) return "";
  if(h.wind_speed<1.5) return "blankt";
  if(h.wind_speed<3) return "nesten blankt";
  return WIND_WORD[h.wind_type]||"";
}
const $ = s => document.querySelector(s);
const nf1 = new Intl.NumberFormat("nb-NO",{maximumFractionDigits:1, minimumFractionDigits:1});
const nf0 = new Intl.NumberFormat("nb-NO",{maximumFractionDigits:0});
const fmtHour = new Intl.DateTimeFormat("nb-NO",{hour:"2-digit",timeZone:TZ});
const fmtTime = new Intl.DateTimeFormat("nb-NO",{hour:"2-digit",minute:"2-digit",timeZone:TZ});
const fmtDay = new Intl.DateTimeFormat("nb-NO",{weekday:"long",timeZone:TZ});
const fmtDayShort = new Intl.DateTimeFormat("nb-NO",{weekday:"short",timeZone:TZ});
const fmtDate = new Intl.DateTimeFormat("nb-NO",{weekday:"short",day:"numeric",month:"short",timeZone:TZ});
const dayKey = d => new Intl.DateTimeFormat("sv-SE",{timeZone:TZ}).format(d);

let DATA = null, state = {tab:"varsel", spot:null, sel:0}, logDraft = {};

function compass(deg){
  if(deg==null) return "–";
  const n=["N","NNØ","NØ","ØNØ","Ø","ØSØ","SØ","SSØ","S","SSV","SV","VSV","V","VNV","NV","NNV"];
  return n[Math.round(((deg%360)+360)%360/22.5)%16];
}
function relDay(d){
  const today = dayKey(new Date()), k = dayKey(d);
  const tmr = dayKey(new Date(Date.now()+864e5));
  if(k===today) return "i dag";
  if(k===tmr) return "i morgen";
  return fmtDay.format(d);
}
function relDayShort(d){
  const r = relDay(d);
  if(r==="i dag" || r==="i morgen") return r;
  return fmtDayShort.format(d).replace(/\.$/,"");
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---------- Stjerner ---------- */
const STAR_PATH = "M12 2.8l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 16.8l-5.4 2.9 1-6.1L3.2 9.3l6.1-.9z";
function starsSVG(solid, faded, big){
  let out = "";
  for(let i=0;i<5;i++){
    const cls = i<solid ? "st-solid" : i<solid+faded ? "st-faded" : "st-empty";
    out += `<svg viewBox="0 0 24 24" aria-hidden="true"><path class="${cls}" d="${STAR_PATH}"/></svg>`;
  }
  const label = `${solid} av 5 stjerner` + (faded ? `, ${faded} tapt på vind eller tidevann` : "");
  return `<span class="stars${big?" big":""}" role="img" aria-label="${label}">${out}</span>`;
}

function favIconSvg(active){
  return `<svg viewBox="0 0 24 24" aria-hidden="true"><path class="${active?"fav-solid":"fav-outline"}" d="${STAR_PATH}"/></svg>`;
}
function isFavSpot(id){
  return !!(window.Auth && Auth.state.favorites && Auth.state.favorites.has(id));
}
function favBtnHtml(id, wrap){
  const active = isFavSpot(id);
  const inner = `<button type="button" class="fav-btn" data-fav="${esc(id)}" aria-pressed="${active}" aria-label="${active?"Fjern fra favoritter":"Legg til favoritter"}">${favIconSvg(active)}</button>`;
  return wrap ? `<div class="fav-btn-wrap">${inner}</div>` : inner;
}
async function toggleFavoriteUI(spotId){
  if(!window.Auth || !Auth.state.user){
    toast("Logg inn for å lagre favoritter", "Logg inn", ()=>{ state.tab = "innstillinger"; render(); window.scrollTo(0,0); });
    return;
  }
  try{ await Auth.toggleFavorite(spotId); }
  catch(e){ toast("Kunne ikke lagre favoritt: " + e.message); }
}
function wireFavButtons(){
  document.querySelectorAll(".fav-btn").forEach(b=>b.onclick=()=>toggleFavoriteUI(b.dataset.fav));
}

/* ---------- Beste vindu ---------- */
function bestWindow(spot){
  const hrs = spot.hours.filter(h => h.daylight !== false && new Date(h.t) >= new Date(Date.now()-36e5));
  if(!hrs.length) return null;
  const max = Math.max(...hrs.map(h=>h.stars));
  if(max < 2) return {none:true};
  let start=null, end=null;
  for(const h of hrs){
    const gap = end ? new Date(h.t) - new Date(end.t) : 0;
    if(h.stars===max && (!start || gap<=36e5)){ if(!start) start=h; end=h; }
    else if(start) break;
  }
  return {stars:max, start:new Date(start.t), end:new Date(new Date(end.t).getTime()+36e5)};
}
function toHourKey(d){ return d.toISOString().slice(0,13)+":00Z"; }
function bestText(spot){
  const b = bestWindow(spot);
  if(!b) return "Ingen data i lyse timer";
  if(b.none) return "Ingen brukbare vinduer de neste tre dagene";
  const anslag = spot.bw_until && toHourKey(b.start) > spot.bw_until ? " (anslag)" : "";
  return `Best ${relDay(b.start)} ${fmtHour.format(b.start)}–${fmtHour.format(b.end)}, ${b.stars} ${b.stars===1?"stjerne":"stjerner"}${anslag}`;
}
function currentHour(spot){
  const now = Date.now();
  let idx = spot.hours.findIndex(h => new Date(h.t).getTime() + 36e5 > now);
  return Math.max(0, idx);
}

/* ---------- Kommende dager ---------- */
function dayChipsHtml(spot, spotIdx){
  const days = new Map();
  spot.hours.forEach((h,i)=>{ const k = dayKey(new Date(h.t)); if(!days.has(k)) days.set(k,[]); days.get(k).push([h,i]); });
  const bw = spot.bw_until;
  const chips = [...days.values()].map(list=>{
    const d = new Date(list[0][0].t);
    const shortLbl = relDayShort(d), fullLbl = cap(relDay(d));
    const lit = list.filter(([h])=>h.daylight===true);
    if(!lit.length){
      return `<button type="button" class="daychip dark" data-spot="${spotIdx}" data-sel="${list[0][1]}" aria-label="${esc(fullLbl)}, mørkt hele dagen">
        <span class="dc-day">${esc(shortLbl)}</span><span class="dc-dark">Mørkt</span>
      </button>`;
    }
    let best = lit[0];
    for(const pair of lit) if(pair[0].stars > best[0].stars) best = pair;
    const [h, idx] = best;
    const good = h.stars >= 3;
    const anslag = !!(bw && h.t > bw);
    const heightTxt = h.likely_flat ? "Flatt" : (h.height!=null ? nf1.format(h.height)+" m" : "–");
    const heightSpoken = h.likely_flat ? "Flatt" : (h.height!=null ? nf1.format(h.height)+" meter" : "ingen data");
    const timeTxt = fmtHour.format(new Date(h.t));
    const cls = ["daychip", good?"good":"", anslag?"anslag":""].filter(Boolean).join(" ");
    const lbl = `${fullLbl}, beste time klokka ${timeTxt.replace(/^0/,"")}, ${h.stars} av 5 stjerner, ${heightSpoken}${anslag?", anslag":""}`;
    return `<button type="button" class="${cls}" data-spot="${spotIdx}" data-sel="${idx}" aria-label="${esc(lbl)}">
      <span class="dc-day">${esc(shortLbl)}</span>
      ${starsSVG(h.stars, h.faded)}
      <span class="dc-h">${esc(heightTxt)}</span>
      <span class="dc-t">${esc(timeTxt)}${anslag?' · anslag':''}</span>
    </button>`;
  }).join("");
  return `<div class="daychips" role="list" aria-label="Kommende dager">${chips}</div>`;
}

/* ---------- Visninger ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current", t.dataset.tab===state.tab ? "page" : "false"));
  $("#toolbar").hidden = !(state.tab==="varsel" && state.spot!=null);
  const isMap = state.tab==="kart";
  $("#mapRoot").hidden = !isMap;
  $("#app").hidden = isMap;
  if(isMap){ window.SurfMap && SurfMap.show(); return; }
  window.SurfMap && SurfMap.hide();
  if(state.tab==="logger") return renderLogs();
  if(state.tab==="innstillinger") return renderSettings();
  if(state.spot!=null) return renderSpot();
  renderList();
}

function sampleBanner(){
  return DATA.sample ? `<p class="sample"><b>Oppdiktet vær, ikke dagens varsel.</b> Dette er bare for å vise hvordan appen ser ut. Ekte varsel kommer når henteren har kjørt.</p>` : "";
}

function renderList(){
  const gen = new Date(DATA.generated);
  const order = DATA.spots.map((s,i)=>i).sort((a,b)=>{
    const fa = isFavSpot(DATA.spots[a].id) ? 0 : 1;
    const fb = isFavSpot(DATA.spots[b].id) ? 0 : 1;
    return fa - fb;
  });
  let rows = order.map(i=>{
    const s = DATA.spots[i];
    const h = s.hours[currentHour(s)];
    if(!h) return "";
    const facts = [
      h.height!=null ? `${nf1.format(h.height)} m` : null,
      h.period!=null ? `${nf0.format(h.period)} s` : null,
      h.wind_speed!=null ? `${WIND_WORD[h.wind_type]||""} ${nf0.format(h.wind_speed)} m/s` : null,
    ].filter(Boolean).map(f=>`<span>${f}</span>`).join("");
    return `<div class="spotrow">
      <button class="row" data-spot="${i}">
        <span><span class="name">${esc(s.name)}</span><br><span class="area">${esc(s.area||"")}</span></span>
        <span style="display:flex;align-items:center;gap:8px">${starsSVG(h.stars,h.faded)}<span class="chev" aria-hidden="true">›</span></span>
        <span class="facts">${facts}${h.likely_flat?"<span>trolig flatt</span>":(h.uncertain?"<span>usikkert</span>":"")}</span>
        <span class="best">${bestText(s)}</span>
      </button>
      ${favBtnHtml(s.id, true)}
      ${dayChipsHtml(s, i)}
    </div>`;
  }).join("");
  $("#app").innerHTML = `${sampleBanner()}
    <header class="top"><h1>Varsel</h1><p class="sub">${DATA.sample?"Eksempel, ikke ekte data":`Oppdatert ${relDay(gen)} kl. ${fmtTime.format(gen)}`}</p></header>
    <div class="list">${rows}</div>`;
  document.querySelectorAll(".row").forEach(b=>b.onclick=()=>{
    state.spot = +b.dataset.spot; state.sel = currentHour(DATA.spots[state.spot]); render(); window.scrollTo(0,0);
  });
  document.querySelectorAll(".daychip").forEach(b=>b.onclick=()=>{
    state.spot = +b.dataset.spot; state.sel = +b.dataset.sel; state.scrollToSel = true; render(); window.scrollTo(0,0);
  });
  wireFavButtons();
}

function heightSourceText(h, spot){
  if(h.height_source==="barentswatch") return h.bw_interpolated ? "BarentsWatch (interpolert)" : "BarentsWatch";
  if(h.height_source==="svell_ute"){
    const t = nf1.format(h.transfer).replace(/,0$/,"");
    const cal = (spot&&spot.calibration)||{};
    const src = cal.transfer_source==="barentswatch" ? " (lært fra BarentsWatch)" : cal.transfer_source==="logs" ? " (lært fra loggene dine)" : "";
    if(h.directness>=0.999) return `Svell ute × ${t}, direkte treff${src}`;
    return `Svell ute × ${t} × ${nf0.format(h.directness*100)} % (skrått inn)${src}`;
  }
  return h.turn!=null && h.turn>=10 ? "met.no, justert" : "met.no";
}
function windowText(spot){
  const w = spot.swell_window;
  if(!w) return "";
  const secs = Array.isArray(w[0]) ? w : [w];
  return "Vindu " + secs.map(([a,b])=>`${a}–${b}°`).join(", ");
}
function directionHitText(h){
  if(h.directness==null) return "";
  if(h.directness < 0.667) return "Utenfor vinduet";
  if(h.directness >= 0.999) return "Midt i vinduet";
  return "I kanten av vinduet";
}
function nextTide(spot, t){
  const after = (spot.tide_events||spot.tide||[]).filter(x=>new Date(x.time) >= t);
  return after[0] || null;
}
function lightClass(x){
  const l = x.light || (x.daylight===false ? "mørkt" : "dag");
  return l==="mørkt" ? " dark" : l==="skumring" ? " dusk" : "";
}
function lightText(spot, t){
  const d = (spot.light_days||{})[dayKey(t)];
  if(!d) return {k:"Lys", v:"–", n:""};
  if(!d.start) return {k:"Lys", v:"Mørkt hele dagen", n:"Ingen brukbart lys"};
  return {k:"Brukbart lys", v:`${fmtTime.format(new Date(d.start))}–${fmtTime.format(new Date(d.end))}`,
    n: d.sun ? "Fra skumring til skumring" : "Mørketid, bare skumring"};
}

function renderSpot(){
  const s = DATA.spots[state.spot];
  const h = s.hours[state.sel];
  const t = new Date(h.t);
  const fw = h.faded_wind ?? h.faded, ft = h.faded_tide ?? 0;
  const losses = [fw?`${WIND_WORD[h.wind_type]||""}vinden tar ${fw}`:null, ft?`tidevannet tar ${ft}`:null].filter(Boolean);
  const verdict = h.faded
    ? `${STAR_WORDS[h.stars]}. Svellet er verdt ${h.stars+h.faded}, men ${losses.join(" og ")}.`
    : `${STAR_WORDS[h.stars]}.`;

  // Timestripe gruppert per dag
  const days = {};
  s.hours.forEach((x,i)=>{ const k=dayKey(new Date(x.t)); (days[k]=days[k]||[]).push([x,i]); });
  const strip = Object.values(days).map(list=>{
    const d = new Date(list[0][0].t);
    const cols = list.map(([x,i])=>{
      let pips = "";
      for(let k=0;k<x.stars;k++) pips += `<span class="pip"></span>`;
      for(let k=0;k<x.faded;k++) pips += `<span class="pip f"></span>`;
      if(!x.stars && !x.faded) pips = `<span class="pip z"></span>`;
      const isReserve = !!(s.bw_until && x.t > s.bw_until);
      const isBreak = isReserve && (i===0 || !(s.bw_until && s.hours[i-1].t > s.bw_until));
      const lbl = `${fmtHour.format(new Date(x.t))}: ${x.stars} stjerner${x.faded?`, ${x.faded} tapt på vind`:""}${x.light==="mørkt"||x.daylight===false?", mørkt":(x.light==="skumring"?", skumring":"")}${isReserve?", anslag":""}`;
      return `<button class="h${lightClass(x)}${i===state.sel?" sel":""}${isReserve?" resmodel":""}${isBreak?" bw-break":""}" data-i="${i}" aria-label="${lbl}" aria-pressed="${i===state.sel}">
        <span class="bar">${pips}</span><span class="hl">${fmtHour.format(new Date(x.t))}</span></button>`;
    }).join("");
    return `<div class="day"><span class="day-label">${relDay(d)}</span><div class="hours">${cols}</div></div>`;
  }).join("");

  // Advarsel om retning/dreining
  let warn = "";
  if(h.height_source==="barentswatch"){
    const interp = h.bw_interpolated ? " Denne timen er interpolert mellom to BarentsWatch-punkter." : "";
    warn = `<div class="warn"><span aria-hidden="true">✓</span><span><b>Høyden er fra BarentsWatch.</b> Finmasket modell for kysten, den mest pålitelige kilden for denne spoten.${interp}</span></div>`;
  } else if(h.height_source==="svell_ute" && h.directness < 0.667){
    warn = `<div class="warn"><span aria-hidden="true">⚠︎</span><span><b>Svellet kommer fra ${compass(h.dir_offshore)} (${Math.round(h.dir_offshore)}°), utenfor vinduet.</b> Bare ${nf0.format(h.directness*100)} % av høyden ved direkte treff bøyer seg inn. Usikkert, maks 3 stjerner.</span></div>`;
  } else if(h.height_source==="svell_ute" && h.directness < 1){
    warn = `<div class="warn"><span aria-hidden="true">ⓘ</span><span><b>Svellet kommer i kanten av vinduet (${compass(h.dir_offshore)}, ${Math.round(h.dir_offshore)}°).</b> ${nf0.format(h.directness*100)} % av høyden ved direkte treff når inn.</span></div>`;
  } else if(h.height_source==="metno_korrigert" && h.likely_flat && (h.turn==null || h.turn<=25)){
    warn = `<div class="warn"><span aria-hidden="true">⚠︎</span><span><b>Svellet kommer fra ${compass(h.dir_offshore)} (${h.dir_offshore!=null?Math.round(h.dir_offshore):"–"}°), utenfor vinduet til spoten.</b> Modellen kan vise bølgehøyde her, men svellet treffer ikke stranda.</span></div>`;
  } else if(h.height_source==="metno_korrigert" && h.likely_flat){
    warn = `<div class="warn"><span aria-hidden="true">⚠︎</span><span><b>Svellet dreier ${Math.round(h.turn)}° inn i bukta.</b> Så stor dreining betyr som regel at det er mye mindre enn modellene viser. Høyden er justert kraftig ned.</span></div>`;
  } else if(h.uncertain){
    warn = `<div class="warn"><span aria-hidden="true">ⓘ</span><span><b>Usikkert varsel, maks 3 stjerner.</b> ${h.turn!=null?`Svellet dreier ${Math.round(h.turn)}° og h`:"H"}øyden er et anslag fra met.no. Blir sikrere når BarentsWatch er koblet på.</span></div>`;
  }

  const tide = nextTide(s,t);
  const lt = lightText(s,t);
  const tideNow = h.tide ? `${h.tide.rising?"Stigende":"Fallende"}, ${h.tide.state}` : "–";
  const tidePref = s.tide && s.tide.length ? `Spoten liker ${s.tide.join(" og ")} vann` : "Spoten tåler alt tidevann";

  $("#app").innerHTML = `${sampleBanner()}
    <header class="top">
      <button class="back" id="back"><span aria-hidden="true" style="font-size:24px">‹</span> Varsel</button>
      <div class="spot-title-row"><h1>${esc(s.name)}</h1>${favBtnHtml(s.id, false)}</div>
      <p class="sub">${relDay(t)} kl. ${fmtHour.format(t)}${h.daylight===false?", mørkt":""}</p>
    </header>
    <button type="button" class="now" id="bdOpen" aria-label="Hvorfor denne ratingen? Trykk for forklaring">${starsSVG(h.stars,h.faded,true)}</button>
    <p class="verdict">${verdict}</p>
    <p class="sub" style="margin-top:6px">${bestText(s)}</p>
    ${warn}
    <div class="strip-wrap" id="stripWrap"><div class="strip">${strip}</div></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--star)"></i>Stjerner</span>
      <span><i class="sw" style="border:1.5px dashed var(--star)"></i>Tapt på vind eller tidevann</span>
      <span><i class="sw" style="background:color-mix(in srgb,var(--night) 50%,transparent);border:1px solid var(--line)"></i>Skumring</span>
      <span><i class="sw" style="background:var(--night);border:1px solid var(--line)"></i>Mørkt</span>
    </div>
    <div class="grid">
      <div class="cell"><div class="k">Høyde på spoten</div><div class="v">${h.height!=null?nf1.format(h.height)+" m":"–"}</div><div class="n">${heightSourceText(h,s)}${h.bw_height_max!=null?` · Sett opp til ${nf1.format(h.bw_height_max)} m`:""}</div></div>
      <div class="cell"><div class="k">Svell ute</div><div class="v">${h.swell_offshore!=null?nf1.format(h.swell_offshore)+" m":(h.height_offshore!=null?nf1.format(h.height_offshore)+" m":"–")}</div><div class="n">fra ${compass(h.dir_offshore)} (${h.dir_offshore!=null?Math.round(h.dir_offshore):"–"}°)${h.swell_offshore!=null&&h.height_offshore!=null?`, med vindsjø ${nf1.format(h.height_offshore)} m`:""}</div></div>
      <div class="cell"><div class="k">Retningstreff</div><div class="v">${h.directness!=null?nf0.format(h.directness*100)+" %":"–"}</div><div class="n">${directionHitText(h)}${directionHitText(h)?" · ":""}${windowText(s)}</div></div>
      <div class="cell"><div class="k">Periode</div><div class="v">${h.period!=null?nf0.format(h.period)+" s":"–"}</div><div class="n">Open-Meteo</div></div>
      <div class="cell"><div class="k">Vind</div><div class="v">${h.wind_speed!=null?nf0.format(h.wind_speed)+" m/s":"–"}</div><div class="n">${esc(windLabel(h))} fra ${compass(h.wind_dir)}${h.gust!=null?`, kast ${nf0.format(h.gust)}`:""}</div></div>
      <div class="cell"><div class="k">Tidevann</div><div class="v">${tideNow}</div><div class="n">${tide?`${tide.type} kl. ${fmtTime.format(new Date(tide.time))}. `:""}${tidePref}</div></div>
      <div class="cell"><div class="k">${lt.k}</div><div class="v">${lt.v}</div><div class="n">${lt.n}</div></div>
      <div class="cell wide"><div class="k">Vann og luft</div><div class="v">${h.water_temp!=null?nf0.format(h.water_temp)+" °C":"–"} i vannet, ${h.air_temp!=null?nf0.format(h.air_temp)+" °C":"–"} i lufta</div></div>
    </div>
    <h2 class="sec">Rapporter fra andre</h2>
    <div class="reports" id="reportsSection"><p style="color:var(--muted);padding:14px 0">Laster…</p></div>`;

  $("#back").onclick = ()=>{ state.spot=null; render(); };
  wireFavButtons();
  $("#bdOpen").onclick = ()=>openBreakdown(h);
  document.querySelectorAll(".h").forEach(b=>b.onclick=()=>{
    const x = $("#stripWrap").scrollLeft; state.sel=+b.dataset.i; renderSpot(); $("#stripWrap").scrollLeft = x;
  });
  if(state.scrollToSel){
    state.scrollToSel = false;
    const sel = $(".h.sel");
    if(sel) sel.scrollIntoView({inline:"center", block:"nearest"});
  }
  loadReportsUI(s.id);
}

/* ---------- Rapporter ---------- */
const WIND_IMPRESSION_WORD = {offshore:"Offshore", onshore:"Onshore", side:"Sidevind", stille:"Stille"};
function reportItemHtml(r){
  const mine = !!(window.Auth && Auth.state.user && r.user_id === Auth.state.user.id);
  const name = r.profiles && r.profiles.display_name ? esc(r.profiles.display_name) : "Ukjent";
  const d = new Date(r.created_at);
  const extras = [
    r.wave_height_m!=null ? `${nf1.format(r.wave_height_m)} m` : null,
    r.wind_impression ? WIND_IMPRESSION_WORD[r.wind_impression] : null,
  ].filter(Boolean).join(" · ");
  return `<div class="report">
    <div class="report-head">
      <b>${name}</b>
      <span class="report-time">${relDay(d)} kl. ${fmtTime.format(d)}</span>
      ${mine?`<button type="button" class="report-del" data-id="${esc(r.id)}">Slett</button>`:""}
    </div>
    ${extras?`<p class="report-extras">${esc(extras)}</p>`:""}
    <p class="report-text">${esc(r.text)}</p>
  </div>`;
}
function reportFormHtml(){
  const a = window.Auth && Auth.state;
  if(!a || !a.user){
    return `<p style="color:var(--muted);padding:14px 0">Logg inn for å se og skrive rapporter.</p>`;
  }
  if(!a.profile){
    return `<p style="color:var(--muted);padding:14px 0">Sett et visningsnavn i <a href="#" id="gotoKonto">Innstillinger</a> før du kan skrive rapporter.</p>`;
  }
  return `<div class="report-form">
    <textarea id="reportText" maxlength="500" rows="3" placeholder="Hvordan var det i vannet?"></textarea>
    <div class="report-form-row">

/* ---------- Logger ---------- */
function loadLogs(){ try{ return JSON.parse(localStorage.getItem(LOG_KEY)) || []; }catch(e){ return []; } }
function saveLogs(l){ try{ localStorage.setItem(LOG_KEY, JSON.stringify(l)); return true; }catch(e){ return false; } }

function forecastAt(spotId, t){
  const s = DATA.spots.find(x=>x.id===spotId); if(!s) return null;
  const key = new Date(Math.floor(t.getTime()/36e5)*36e5).toISOString().slice(0,13)+":00Z";
  return s.hours.find(h=>h.t===key) || null;
}

function renderLogs(){
  const logs = loadLogs().sort((a,b)=>b.t.localeCompare(a.t));
  const calib = DATA.spots.map(s=>{
    const withF = logs.filter(l=>l.spot===s.id && l.forecastStars!=null);
    if(!withF.length) return `<div class="calib"><div class="t">${esc(s.name)}</div><p>Ingen logger med varsel å sammenligne mot ennå.</p></div>`;
    const hits = withF.filter(l=>Math.abs(l.stars-l.forecastStars)<=1).length;
    const bias = withF.reduce((a,l)=>a+(l.stars-l.forecastStars),0)/withF.length;
    const dir = Math.abs(bias)<0.5 ? "Varselet ligger omtrent riktig." : bias>0 ? `Varselet undervurderer med ${nf1.format(bias)} stjerner i snitt.` : `Varselet overvurderer med ${nf1.format(-bias)} stjerner i snitt.`;
    return `<div class="calib"><div class="t">${esc(s.name)}: traff ${hits} av ${withF.length}</div><p>${dir} Treff betyr innenfor én stjerne.</p></div>`;
  }).join("");
  const heightCal = DATA.spots.map(s=>{
    // Samme formel som fetcher/calibrate.py: forhold mot toppfaktoren ved
    // DIREKTE treff, ikke ved skrått svell. Gamle logger uten directness
    // antas direkte (1.0). Svell langt utenfor vinduet (directness < 0.3)
    // sier lite om direkte treff og hoppes over.
    const pts = logs.filter(l=>l.spot===s.id && l.size && SIZE_M[l.size]!=null && l.swellOffshore>0.2 && (l.directness??1.0)>=0.3)
      .map(l=>SIZE_M[l.size]/(l.swellOffshore*(l.directness??1.0))).sort((a,b)=>a-b);
    const cal = s.calibration || {};
    const pct = nf0.format((cal.transfer_used ?? (s.hours[0]||{}).transfer ?? 0.6) * 100);
    if(cal.transfer_source==="logs"){
      return `<div class="calib"><div class="t">${esc(s.name)}: ${pct} % av svellet når stranda ved direkte treff</div>
        <p>Lært automatisk fra ${cal.size_logs} økter du har logget, og brukt i varselet.</p></div>`;
    }
    if(cal.transfer_source==="barentswatch"){
      return `<div class="calib"><div class="t">${esc(s.name)}: ${pct} % av svellet når stranda ved direkte treff</div>
        <p>Lært fra BarentsWatch (${cal.bw_pairs} par over ${cal.bw_days} døgn).</p></div>`;
    }
    if(pts.length < MIN_SIZE_LOGS){
      const bwNote = cal.bw_pairs ? ` Lærer også fra BarentsWatch i bakgrunnen (${cal.bw_pairs} par over ${cal.bw_days} døgn så langt, trenger ${40} par over minst 3 døgn).` : "";
      return `<div class="calib"><div class="t">${esc(s.name)}</div><p>Trenger ${MIN_SIZE_LOGS-pts.length} økt${MIN_SIZE_LOGS-pts.length===1?"":"er"} til med størrelse valgt for å lære hvor mye av svellet som når stranda ved direkte treff.${bwNote}</p></div>`;
    }
    const med = pts[Math.floor(pts.length/2)];
    return `<div class="calib"><div class="t">${esc(s.name)}: ${nf0.format(med*100)} % av svellet når stranda ved direkte treff</div>
      <p>Lært fra ${pts.length} økter. Appen bruker nå ${pct} % (${cal.transfer_source==="spots.json"?"satt i spots.json":"standardverdi"}). Sett <b>"transfer": ${med.toFixed(2)}</b> for ${esc(s.id)} i spots.json.</p></div>`;
  }).join("");
  // Hvilket BarentsWatch-punkt (250 m, brukt i varselet, eller 150 m, det
  // opprinnelige) som faktisk ligger nærmest det du har logget. Bytter
  // ALDRI punkt selv - bare til orientering.
  const bwCompare = DATA.spots.map(s=>{
    const withSize = logs.filter(l=>l.spot===s.id && l.size && SIZE_M[l.size]!=null);
    if(withSize.length < MIN_SIZE_LOGS){
      const left = MIN_SIZE_LOGS - withSize.length;
      return `<div class="calib"><div class="t">${esc(s.name)}</div><p>Trenger ${left} økt${left===1?"":"er"} til med størrelse valgt for å sammenligne BarentsWatch-punktene.</p></div>`;
    }
    const withBoth = withSize.filter(l=>l.bwHeight!=null && l.bwHeightNear!=null);
    if(!withBoth.length){
      return `<div class="calib"><div class="t">${esc(s.name)}</div><p>Ingen av de ${withSize.length} øktene med størrelse har data fra begge punktene ennå.</p></div>`;
    }
    const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
    const dev250 = avg(withBoth.map(l=>Math.abs(SIZE_M[l.size]-l.bwHeight)));
    const dev150 = avg(withBoth.map(l=>Math.abs(SIZE_M[l.size]-l.bwHeightNear)));
    const better = dev250<=dev150 ? "250 m" : "150 m";
    return `<div class="calib"><div class="t">${esc(s.name)}: ${better}-punktet ligger nærmest det du har logget</div>
      <p>Snittavvik fra ${withBoth.length} økter: 250 m-punktet ${nf1.format(dev250)} m, 150 m-punktet ${nf1.format(dev150)} m. Varselet bruker fortsatt 250 m-punktet - bytt manuelt i spots.json om du vil.</p></div>`;
  }).join("");
  const rows = logs.map(l=>{
    const s = DATA.spots.find(x=>x.id===l.spot); const d = new Date(l.t);
    const extra = [l.size,l.wind].filter(Boolean).join(", ");
    const fc = l.forecastStars!=null ? `Varsel: ${l.forecastStars}` : "Uten varsel";
    return `<div class="logrow"><span><b>${esc(s?s.name:l.spot)}</b> ${starsSVG(l.stars,0)}</span>
      <button class="del" data-id="${l.id}" aria-label="Slett økt ${fmtDate.format(d)}">Slett</button>
      <span class="m">${fmtDate.format(d)} kl. ${fmtTime.format(d)}. ${fc}${extra?`. ${esc(extra)}`:""}</span></div>`;
  }).join("");
  $("#app").innerHTML = `<header class="top"><h1>Logger</h1><p class="sub">Hver logg gjør varselet ærligere.</p></header>
    <h2 class="sec">Treffsikkerhet</h2>${calib}
    <h2 class="sec">Bølgehøyde</h2>${heightCal}
    <h2 class="sec">BarentsWatch-punkt</h2>${bwCompare}
    <h2 class="sec">Økter</h2>
    <div class="list">${rows || `<p class="empty">Ingen økter ennå. Åpne en spot og trykk Logg økt etter neste tur.</p>`}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="ghost" id="newLog">Logg økt</button></div>`;
  document.querySelectorAll(".del").forEach(b=>b.onclick=()=>{
    const all = loadLogs(); const removed = all.find(l=>l.id===b.dataset.id);
    saveLogs(all.filter(l=>l.id!==b.dataset.id)); markDeleted(b.dataset.id); renderLogs(); syncLogs();
    toast("Økt slettet", "Angre", ()=>{ unmarkDeleted(removed.id); saveLogs([...loadLogs(), removed]); renderLogs(); syncLogs(); });
  });
  $("#newLog").onclick = ()=>openSheet();
}

/* ---------- Synk til privat GitHub-repo ---------- */
const SYNC_KEY = "nordsurf.sync.v1", DEL_KEY = "nordsurf.deleted.v1";
function loadSync(){ try{ return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; }catch(e){ return {}; } }
function saveSync(s){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(s)); }catch(e){} }
function loadDeleted(){ try{ return JSON.parse(localStorage.getItem(DEL_KEY)) || []; }catch(e){ return []; } }
function markDeleted(id){ try{ localStorage.setItem(DEL_KEY, JSON.stringify([...new Set([...loadDeleted(), id])])); }catch(e){} }
function unmarkDeleted(id){ try{ localStorage.setItem(DEL_KEY, JSON.stringify(loadDeleted().filter(x=>x!==id))); }catch(e){} }
const b64 = s => btoa(unescape(encodeURIComponent(s)));
const unb64 = s => decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
let syncing = false;
async function syncLogs(manual){
  const cfg = loadSync();
  if(!cfg.repo || !cfg.token){ if(manual) toast("Legg inn repo og nøkkel først"); return; }
  if(syncing) return; syncing = true;
  const url = `https://api.github.com/repos/${cfg.repo}/contents/logs.json`;
  const headers = {Authorization:`Bearer ${cfg.token}`, Accept:"application/vnd.github+json"};
  try{
    let remote = {logs:[], deleted:[]}, sha;
    const r = await fetch(url,{headers, cache:"no-store"});
    if(r.ok){ const j = await r.json(); sha = j.sha; remote = JSON.parse(unb64(j.content)); }
    else if(r.status!==404) throw new Error(r.status===401?"Nøkkelen er ugyldig eller utløpt":`GitHub svarte ${r.status}`);
    const deleted = [...new Set([...(remote.deleted||[]), ...loadDeleted()])];
    const byId = {};
    [...(remote.logs||[]), ...loadLogs()].forEach(l=>byId[l.id]=l);
    const merged = Object.values(byId).filter(l=>!deleted.includes(l.id));
    const body = JSON.stringify({logs:merged, deleted}, null, 1);
    const put = await fetch(url,{method:"PUT", headers, body: JSON.stringify({message:"Oppdater logger", content:b64(body), ...(sha?{sha}:{})})});
    if(!put.ok) throw new Error(put.status===409?"Konflikt, prøv igjen":`Lagring feilet (${put.status})`);
    saveLogs(merged);
    saveSync({...cfg, last:new Date().toISOString(), error:null});
    if(manual) toast(`Synket ${merged.length} økter`);
  }catch(e){
    saveSync({...cfg, error:e.message});
    if(manual) toast(`Synk feilet: ${e.message}`);
  }finally{
    syncing = false;
    if(state.tab==="innstillinger") renderSettings();
    if(state.tab==="logger") renderLogs();
  }
}

    syncLogs();
  }catch(e){
    $("#app").innerHTML = `<header class="top"><h1>Varsel</h1></header><p class="empty">Fant ikke varseldata. Kjør henteren (fetcher/fetch.py) eller vent på neste automatiske kjøring.</p>`;
  }
}
start();
if("serviceWorker" in navigator && location.protocol==="https:" && !window.__FORECAST__) navigator.serviceWorker.register("sw.js").catch(()=>{});
