<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F3F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1B21" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Nordsurf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/map.css">
<style>
:root{
  --surface:#F1F3F2; --raised:#FFFFFF; --ink:#16252D; --muted:#52646C; --line:#D5DCDE;
  --star:#A86F08; --night:#C9D2D5; --dusk:#E2E7E9; --selected:#16252D; --on-selected:#FFFFFF;
  /* ROADMAP oppgave C: fargeskala for rating 0-5, brukt overalt (stjerner,
     ringen på skiva, kartmerker, søyler, dagbrikker). Farge er aldri eneste
     bærer - tall eller stjerner står alltid ved siden av. Kontrast mot
     bakgrunnen (3:1 for grafiske elementer) sjekket i STATUS.md. */
  --r0:#7D8B92; --r1:#D64F2A; --r2:#B98A00; --r3:#2E9E52; --r4:#148E95; --r5:#4A5BD8;
  --on-r0:#FFFFFF; --on-r1:#FFFFFF; --on-r2:#16252D; --on-r3:#FFFFFF; --on-r4:#FFFFFF; --on-r5:#FFFFFF;
  /* Kart: grønt (vindu) og blått (vind) er faste valg. Svell er lilla, ikke
     blågrønn/turøs - det ville ligget for nært vindfargen for fargeblinde
     på det gråtonede kartet. Rav-gult (--star) er forbeholdt rating. */
  --window:#1E7A46; --window-fill:rgba(30,122,70,.16); --swell:#6D3FCE; --swell-miss:#8B98A0; --wind:#1C5FD6;
  --display:"Familjen Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body:system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  color-scheme: light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --surface:#0F1B21; --raised:#17262E; --ink:#E4EBED; --muted:#93A6AE; --line:#26363E;
    --star:#F2B544; --night:#0A1418; --dusk:#1E3039; --selected:#E4EBED; --on-selected:#0F1B21;
    --r0:#8E9CA3; --r1:#F2704B; --r2:#F2C244; --r3:#4FCB75; --r4:#3ED0D8; --r5:#8D9BFF;
    --on-r0:#0F1B21; --on-r1:#0F1B21; --on-r2:#0F1B21; --on-r3:#0F1B21; --on-r4:#0F1B21; --on-r5:#0F1B21;
    --window:#48C97C; --window-fill:rgba(72,201,124,.22); --swell:#B79CFF; --swell-miss:#7C8A92; --wind:#6FA8FF;
  }
}
:root[data-theme="dark"]{
  --surface:#0F1B21; --raised:#17262E; --ink:#E4EBED; --muted:#93A6AE; --line:#26363E;
  --star:#F2B544; --night:#0A1418; --dusk:#1E3039; --selected:#E4EBED; --on-selected:#0F1B21;
  --r0:#8E9CA3; --r1:#F2704B; --r2:#F2C244; --r3:#4FCB75; --r4:#3ED0D8; --r5:#8D9BFF;
  --on-r0:#0F1B21; --on-r1:#0F1B21; --on-r2:#0F1B21; --on-r3:#0F1B21; --on-r4:#0F1B21; --on-r5:#0F1B21;
  --window:#48C97C; --window-fill:rgba(72,201,124,.22); --swell:#B79CFF; --swell-miss:#7C8A92; --wind:#6FA8FF;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--surface);color:var(--ink);font:17px/1.4 var(--body);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--star);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 120px}

/* Sample-banner */
.sample{margin:12px 0 0;padding:10px 14px;border:1px dashed var(--muted);border-radius:10px;font-size:15px;color:var(--muted)}

/* Topp */
header.top{padding:20px 0 8px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 8px 0 0;background:none;border:0;color:var(--ink);font-size:17px;cursor:pointer}
h1{font:700 34px/1.1 var(--display);letter-spacing:-.01em;margin:4px 0 4px}
.sub{color:var(--muted);font-size:15px;margin:0}

/* Stjerner: signaturelementet */
.stars{display:inline-flex;gap:3px;vertical-align:middle}
.stars svg{width:22px;height:22px;display:block}
.stars.big svg{width:34px;height:34px}
.st-solid{fill:var(--star);stroke:var(--star);stroke-width:1.2}
.st-faded{fill:none;stroke:var(--star);stroke-width:1.6;stroke-dasharray:2.4 2;opacity:.8}
.st-empty{fill:none;stroke:var(--line);stroke-width:1.4}

/* Spotliste */
.list{margin:16px 0;background:var(--raised);border-radius:14px;overflow:hidden}
.spotrow{border-top:1px solid var(--line);position:relative}
.spotrow:first-child{border-top:0}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;padding:14px 54px 14px 16px;min-height:44px;background:none;border:0;cursor:pointer}
.row:active{background:var(--surface)}
.row .name{font:700 21px/1.2 var(--display)}
.row .area{color:var(--muted);font-size:15px}
.row .facts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:15px}
.row .best{grid-column:1/-1;font-size:15px}

/* Favoritt */
.fav-btn-wrap{position:absolute;top:6px;right:2px;z-index:1}
.fav-btn{all:unset;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}
.fav-btn svg{width:22px;height:22px;display:block}
.fav-outline{fill:none;stroke:var(--muted);stroke-width:1.5}
.fav-solid{fill:var(--star);stroke:var(--star)}
.fav-btn[aria-pressed="true"]{background:color-mix(in srgb,var(--star) 16%,transparent)}
@media (prefers-reduced-motion: no-preference){.fav-btn svg{transition:transform .15s ease}}
.fav-btn:active svg{transform:scale(.85)}
.spot-title-row{display:flex;align-items:center;gap:4px}
.spot-title-row h1{flex:1;min-width:0}

/* Kommende dager */
.daychips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 16px 14px}
.daychips::-webkit-scrollbar{display:none}
.daychip{all:unset;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:44px;padding:8px 10px;border-radius:12px;background:var(--surface);cursor:pointer;box-sizing:border-box}
.daychip .dc-day{font-size:12px;color:var(--muted);font-weight:600}
.daychip .stars svg{width:11px;height:11px}
.daychip .dc-h{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.daychip .dc-t{font-size:11px;color:var(--muted);white-space:nowrap}
.daychip.good{background:color-mix(in srgb,var(--star) 16%,var(--surface));outline:1.5px solid var(--star);outline-offset:-1.5px}
.daychip.anslag{opacity:.72}
.daychip.dark .dc-dark{font-size:13px;color:var(--muted);margin-top:6px}
.daychip:active{background:var(--line)}
.chev{color:var(--muted);font-size:22px;line-height:1}

/* Detalj */
.now{all:unset;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:14px 0 4px;cursor:pointer;min-height:44px}
.verdict{font-size:17px;margin:6px 0 0}
.warn{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;padding:12px 14px;background:var(--raised);border-radius:12px;font-size:15px}
.warn b{font-weight:600}
.stale{display:block;border-left:4px solid #D35400;margin:12px 0 0}

/* Timestripe med lys og mørke */
.strip-wrap{margin:20px -16px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.strip-wrap::-webkit-scrollbar{display:none}
.strip{display:flex;padding:0 16px;gap:0}
.day{display:flex;flex-direction:column;padding-right:10px}
.day-label{font-size:13px;color:var(--muted);height:20px;padding-left:2px;white-space:nowrap}
.hours{display:flex}
.h{width:30px;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;padding:6px 0 4px;background:none;border:0;cursor:pointer;border-radius:8px}
.h.dark{background:var(--night)}
.h.dusk{background:var(--dusk)}
.h.sel{background:var(--selected);color:var(--on-selected)}
.h.resmodel{opacity:.55}
.h.langtid{opacity:.4}
.h.lang-break{border-left:2px dashed var(--muted);margin-left:4px;padding-left:4px}
.h.bw-break{border-left:2px dashed var(--muted);margin-left:2px;padding-left:4px}
.bar{width:14px;display:flex;flex-direction:column-reverse;gap:2px}
.pip{height:12px;border-radius:3px;background:var(--star)}
.pip.f{background:none;border:1.5px dashed var(--star)}
.pip.z{height:3px;background:var(--line)}
.h .hl{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.h.sel .hl{color:var(--on-selected)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Detaljgrid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:18px 0 0;background:var(--line);border-radius:14px;overflow:hidden}
.cell{background:var(--raised);padding:12px 14px}
.cell .k{font-size:13px;color:var(--muted)}
.infoBtn{all:unset;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:3px;border-radius:50%;color:var(--muted);font-size:12px;cursor:pointer;vertical-align:middle}
.cell .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.cell .n{font-size:13px;color:var(--muted);margin-top:2px}
.cell.wide{grid-column:1/-1}

/* Verktøylinje nederst */
.toolbar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.toolbar[hidden]{display:none}
.primary{pointer-events:auto;min-height:50px;padding:0 28px;border:0;border-radius:25px;background:var(--selected);color:var(--on-selected);font-weight:600;font-size:17px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.18)}

/* Tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
@media (prefers-reduced-transparency: reduce){nav.tabs{background:var(--surface);backdrop-filter:none}}
.tab{flex:0 1 160px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
body.has-tabs .toolbar{bottom:64px}

/* Ark (sheet) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--raised);border-radius:16px 16px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s}
.sheet.open{transform:none;visibility:visible;transition:transform .28s ease}
.scrim.open{display:block}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.sheet-head h2{font:700 20px/1.2 var(--display);margin:0}
.link{background:none;border:0;min-height:44px;padding:0 4px;color:var(--ink);font-size:17px;cursor:pointer}
.field{margin:18px 0 0}
.field > .lbl{font-size:15px;color:var(--muted);margin:0 0 8px}
.starpick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.starpick button{min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.starpick button b{font-size:20px;color:var(--ink)}
.starpick button[aria-pressed="true"]{border-color:var(--selected);background:var(--selected)}
.starpick button[aria-pressed="true"] b,.starpick button[aria-pressed="true"]{color:var(--on-selected)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px}
.chips button[aria-pressed="true"]{border-color:var(--selected);background:var(--selected);color:var(--on-selected)}
select,input[type="datetime-local"]{font:inherit;font-size:17px;min-height:44px;width:100%;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.save{width:100%;margin-top:24px}
.save:disabled{opacity:.4}
#bdScrim{z-index:40}
#bdSheet{z-index:41}
.breakdown{padding:4px 0 8px}
.breakdown .row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:16px}
.breakdown .row:first-child{border-top:0}
.breakdown .row.total{font-weight:700;border-top:2px solid var(--line);margin-top:4px}
.breakdown .row .lead{color:var(--ink)}
.breakdown .row .eff{color:var(--muted);flex:0 0 auto;text-align:right}

/* Logger */
h2.sec{font:700 22px/1.2 var(--display);margin:26px 0 8px}
.calib{background:var(--raised);border-radius:14px;padding:14px 16px;margin:0 0 10px}
.calib .t{font-weight:600}
.calib p{margin:4px 0 0;color:var(--muted);font-size:15px}
.calib .sugg{margin:6px 0 0;padding:8px 10px;border-radius:10px;background:var(--surface);font-size:14px}
.localrules{background:var(--raised);border-radius:14px;padding:14px 16px;margin:10px 0}
.accrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.accrow .acc{font-size:13px;padding:3px 8px;border-radius:8px;background:var(--surface);color:var(--muted)}
.accrow .acc.malt{color:var(--ink);font-weight:600;border:1px solid var(--line)}
.localrules .sub{margin:4px 0}
.localrules .sub:first-child{margin-top:0}
.expo-chart{width:100%;height:auto;display:block;margin-top:8px}
.expo-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--muted)}
.expo-legend span{display:inline-flex;align-items:center;gap:5px}
.expo-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.logrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.logrow:first-child{border-top:0}
.logrow .m{color:var(--muted);font-size:15px;grid-column:1/-1}
.del{background:none;border:0;color:var(--muted);min-height:44px;min-width:44px;cursor:pointer;font-size:15px}
.empty{color:var(--muted);padding:18px 16px;margin:0}
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:var(--selected);color:var(--on-selected);padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.form{background:var(--raised);border-radius:14px;padding:14px 16px;margin:0 0 10px}
.form label{display:block;font-size:15px;color:var(--muted);margin:10px 0 6px}
.form input[type=text],.form input[type=password]{font:inherit;font-size:17px;min-height:44px;width:100%;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.form p{margin:6px 0 0;color:var(--muted);font-size:15px}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.ghost{background:none;border:1.5px solid var(--line);border-radius:22px;min-height:44px;padding:0 18px;cursor:pointer;font-size:15px}

/* Rapporter */
.reports{background:var(--raised);border-radius:14px;padding:0 16px;margin:0 0 24px}
.report{padding:12px 0;border-top:1px solid var(--line)}
.report:first-child{border-top:0}
.report-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.report-head b{font-size:15px}
.report-time{color:var(--muted);font-size:13px}
.report-del{all:unset;margin-left:auto;color:var(--muted);font-size:13px;cursor:pointer;min-height:44px;display:flex;align-items:center}
.report-extras{margin:4px 0 0;color:var(--muted);font-size:14px}
.report-text{margin:4px 0 0;font-size:15px;white-space:pre-wrap;overflow-wrap:break-word}
.report-form{padding:14px 0;border-top:1px solid var(--line)}
.reports > .report-form:first-child{border-top:0}
.report-form textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.report-form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.report-form-row label{font-size:14px;color:var(--muted)}
.report-form-row input[type=number]{font:inherit;font-size:16px;width:80px;min-height:40px;padding:0 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.report-form-row select{width:auto;min-height:40px}

/* ---------- ROADMAP oppgave C/D/K: nytt design ---------- */
.stars.r0 .st-solid{fill:var(--r0);stroke:var(--r0)} .stars.r1 .st-solid{fill:var(--r1);stroke:var(--r1)} .stars.r2 .st-solid{fill:var(--r2);stroke:var(--r2)}
.stars.r3 .st-solid{fill:var(--r3);stroke:var(--r3)} .stars.r4 .st-solid{fill:var(--r4);stroke:var(--r4)} .stars.r5 .st-solid{fill:var(--r5);stroke:var(--r5)}
.stars .st-faded{stroke:var(--muted)}
.rc0{--rc:var(--r0);--on-rc:var(--on-r0)} .rc1{--rc:var(--r1);--on-rc:var(--on-r1)} .rc2{--rc:var(--r2);--on-rc:var(--on-r2)}
.rc3{--rc:var(--r3);--on-rc:var(--on-r3)} .rc4{--rc:var(--r4);--on-rc:var(--on-r4)} .rc5{--rc:var(--r5);--on-rc:var(--on-r5)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:14px;background:var(--rc);color:var(--on-rc);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pill.big{min-height:36px;padding:0 14px;font-size:17px}
.daychip.good{background:color-mix(in srgb,var(--rc) 18%,var(--surface));outline:1.5px solid var(--rc);outline-offset:-1.5px}

/* Forsiden: kort per spot */
.cards{display:flex;flex-direction:column;gap:12px;margin:14px 0}
.card{position:relative;background:var(--raised);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card .stripe{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--rc)}
.card .card-btn{all:unset;display:block;width:100%;box-sizing:border-box;padding:14px 56px 12px 20px;cursor:pointer}
.card .card-btn:active{background:var(--surface)}
.card .c-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card .name{font:700 22px/1.2 var(--display)}
.card .area{color:var(--muted);font-size:14px}
.card .c-now{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.card .c-h{font:700 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.card .c-h small{font:600 14px/1 var(--body);color:var(--muted)}
.card .c-facts{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;margin-top:6px;color:var(--muted);font-size:14px}
.card .c-facts .f{display:inline-flex;align-items:center;gap:5px}
.card .c-best{margin-top:8px;font-size:14px}
.card .mini{display:block;width:100%;height:50px;margin-top:8px}
.card .fav-btn-wrap{top:8px;right:6px}
.arrow{width:16px;height:16px;display:inline-block;vertical-align:middle;flex:0 0 auto}
.arrow.offshore{color:var(--r3)} .arrow.side{color:var(--r2)} .arrow.sideonshore{color:var(--r1)} .arrow.onshore{color:var(--r1)}

/* Detaljsiden */
.hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:10px 0 0}
.hero .h-h{font:700 40px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero .h-h small{font:600 16px/1 var(--body);color:var(--muted);margin-left:4px}
.hero .h-word{font-size:17px;font-weight:600}
.notice{display:block;margin:12px 0 0;padding:10px 14px;background:var(--raised);border-radius:12px;font-size:15px;border-left:4px solid var(--muted);cursor:pointer}
.notice.bad{border-left-color:var(--r1)}
.notice.ok{border-left-color:var(--r3)}
.sec-card{background:var(--raised);border-radius:16px;padding:14px 16px;margin:14px 0 0}
.sec-card h2{font:700 17px/1.2 var(--display);margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-card h2 .t{display:inline-flex;align-items:center;gap:6px}
.tap{cursor:pointer;border-bottom:1px dotted var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.kv .k{font-size:13px;color:var(--muted)}
.kv .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.kv .n{font-size:13px;color:var(--muted);margin-top:1px}
.kv .wide{grid-column:1/-1}
.swell-row{display:flex;align-items:center;gap:14px;padding:8px 0;border-top:1px solid var(--line)}
.swell-row:first-of-type{border-top:0}
.swell-row .dir{width:44px;height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--surface)}
.swell-row .dir svg{width:26px;height:26px}
.swell-row .lbl{font-size:13px;color:var(--muted)}
.swell-row .val{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.swell-row .val small{font-size:14px;font-weight:500;color:var(--muted)}

/* Surfehøyde-graf (16 dager) */
.graph-wrap{margin:14px -16px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative}
.graph-wrap::-webkit-scrollbar{display:none}
.graph{display:block;height:200px}
.graph .g-day{fill:var(--muted);font-size:12px;font-weight:600}
.graph .g-tick{fill:var(--muted);font-size:10px}
.graph .g-bar{cursor:pointer}
.graph .g-bar.sel rect.main{stroke:var(--ink);stroke-width:2}
.graph .g-lang rect.main{opacity:.55}
.graph .g-hl{fill:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
.graph .g-bar.sel .g-hl{fill:var(--ink);font-weight:700}
.graph .g-bg-dusk{fill:var(--dusk)} .graph .g-bg-dark{fill:var(--night)}
.graph .g-grid{stroke:var(--line);stroke-width:1}
.graph .g-now{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3}
.graph .g-break{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
.g-axis{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 0}
.g-axis .sw{margin:0 3px 0 8px;vertical-align:-1px}
.tide-svg{display:block;width:100%;height:96px}
.tide-svg .t-curve{fill:none;stroke:var(--wind);stroke-width:2}
.tide-svg .t-fill{fill:var(--wind);opacity:.12}
.tide-svg .t-now{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3}
.tide-svg text{fill:var(--muted);font-size:11px}

/* "Detaljer" - lukket som standard (ROADMAP oppgave K) */
details.more{margin:14px 0 0}
details.more > summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 16px;background:var(--raised);border-radius:16px;font:700 17px/1.2 var(--display)}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::after{content:"›";font-size:24px;color:var(--muted);transform:rotate(90deg);transition:transform .15s}
details.more[open] > summary::after{transform:rotate(-90deg)}
details.more[open] > summary{border-radius:16px 16px 0 0}
details.more .grid{margin:1px 0 0;border-radius:0 0 16px 16px}
@media (prefers-reduced-motion: reduce){details.more > summary::after{transition:none}}

/* Forklaringsark (ROADMAP oppgave D) */
#exScrim{z-index:50} #exSheet{z-index:51}
.ex-p{margin:8px 0 0;font-size:16px}
.ex-h{font:700 13px/1.2 var(--display);color:var(--muted);margin:18px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.ex-rows{background:var(--surface);border-radius:12px;padding:4px 12px}
.ex-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.ex-row:first-child{border-top:0}
.ex-k{color:var(--muted)} .ex-v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
</style>
</head>

<script>
/* ---------- Oppsett ---------- */
const TZ = "Europe/Oslo";
const LOG_KEY = "nordsurf.logs.v1";
const SIZES = ["Flatt","Knehøy","Hoftehøy","Brysthøy","Hodehøy","Over hodet","Dobbelt over hodet"];
const WINDS = ["Offshore","Onshore","Rotete","Blankt"];
// Surfehøyde i meter (høyden der bølgene brekker), ikke Hs. 26.09.2026:
// Hodehøy er ny, Over hodet endret fra 2,0 til 2,4, Dobbelt over hodet er
// ny. Samme tabell i fetcher/calibrate.py - test_pipeline.py sjekker at de
// er like.
const SIZE_M = {"Flatt":0, "Knehøy":0.5, "Hoftehøy":0.9, "Brysthøy":1.3, "Hodehøy":1.8, "Over hodet":2.4, "Dobbelt over hodet":3.6};
// Samme formel som fetcher/rating.py sin breaking_height() - brukt her bare
// til BarentsWatch-punkt-sammenligningen i Logger-fanen (SIZE_M er nå
// surfehøyde, bwHeight/bwHeightNear er fortsatt Hs, så de må regnes om
// før de kan sammenlignes mot det du har logget).
function breakingHeight(h, period){
  if(h==null || period==null || h<=0) return null;
  return 0.39 * Math.pow(9.81, 0.2) * Math.pow(period * h * h, 0.4);
}
const MIN_SIZE_LOGS = 5;
const STAR_WORDS = ["Flatt","Dårlig","Ok","Bra","Veldig bra","Rått"];
const PICK_WORDS = ["Flatt","Dårlig","Ok","Bra","Topp","Rått"];
const WIND_WORD = {offshore:"offshore", side:"sidevind", sideonshore:"side-onshore", onshore:"onshore"};
// "sidevind" inneholder allerede "vind" - "sidevind"+"vinden" ville gitt
// "sidevindvinden". De andre (offshore/side-onshore/onshore) er låneord uten
// "vind" i seg, og tåler "vinden" rett på (offshorevinden, onshorevinden,
// side-onshorevinden er alle riktige som de er).
function windNoun(type){
  const w = WIND_WORD[type];
  if(!w) return "vinden";
  return w.endsWith("vind") ? w+"en" : w+"vinden";
}
function windLabel(h){
  // "blankt"/"nesten blankt" under 1,5/3 m/s, ellers vindtypen - se
  // fetcher/rating.py sin wind_label() (samme grenser, regnet ut server-side
  // for breakdown, men grid-cellen her trenger den uavhengig av breakdown).
  if(h.wind_speed==null) return "";
  if(h.wind_speed<1.5) return "blankt";
  if(h.wind_speed<3) return "nesten blankt";
  return WIND_WORD[h.wind_type]||"";
}

// 05.10.2026 (Theodors rettelse, Grøtfjord kl. 11-17 - se STATUS.md): samme
// fire ord for 0 og 1 stjerne overalt - detaljside, liste, dagbrikker og
// kartets høydeplate (js/map.js, vanlig <script> i samme vindu, ikke en
// modul - bruker disse to globalt, se kommentaren øverst der). Speiler
// fetcher/rating.classify_low_rating().
const LOW_REASON_WORD = {flat:"Flatt", blown_out:"Blåst ut", stormsjo:"Stormsjø", treffer_ikke:"Treffer ikke"};
function heightMForDisplay(h){
  // Tallet å vise ved siden av low_reason sitt ord. Flatt/Treffer ikke har
  // ikke noe pålitelig tall å vise fram. Blåst ut/Stormsjø skal vise den
  // ekte høyden i stedet for å gjemme den bak ordet alene (Theodors
  // rettelse 05.10.2026, punkt c) - men de to betyr ulike tall:
  // - blåst ut: surfehøyden hvis den er reell (nær BarentsWatch sin egen
  //   totalhøyde uansett - det er VINDEN som tok stjernene, ikke lav
  //   svellandel), ellers BarentsWatch sin totalhøyde (surfehøyden er
  //   tvunget til 0 av flat-sperren i den gamle, lav-høyde-drevne
  //   "blåst ut"-saken, se is_blown_out()).
  // - stormsjø: ALLTID BarentsWatch sin totalhøyde, aldri surfehøyden -
  //   lav svellandel betyr nettopp at surfehøyden (justert for akkurat
  //   den andelen) er et lite, misvisende tall ved siden av "Stormsjø".
  //   "mye totalhøyde" (Theodors egen begrunnelse, punkt a) er bw_height,
  //   ikke surfehøyden. Funnet av fysikk-kontrollør 05.10.2026 (en ekte
  //   stormsjø-time har ALLTID surf_height>0 - low_hs ville ellers gjort
  //   den til "flat" først, se classify_low_rating()).
  if(!h) return null;
  if(!h.low_reason) return h.surf_height;
  if(h.low_reason==="blown_out") return (h.surf_height!=null && h.surf_height>0) ? h.surf_height : h.bw_height;
  if(h.low_reason==="stormsjo") return h.bw_height!=null ? h.bw_height : h.surf_height;
  return null;
}
const $ = s => document.querySelector(s);
const nf1 = new Intl.NumberFormat("nb-NO",{maximumFractionDigits:1, minimumFractionDigits:1});
const nf0 = new Intl.NumberFormat("nb-NO",{maximumFractionDigits:0});
const fmtHour = new Intl.DateTimeFormat("nb-NO",{hour:"2-digit",timeZone:TZ});
const fmtTime = new Intl.DateTimeFormat("nb-NO",{hour:"2-digit",minute:"2-digit",timeZone:TZ});
const fmtDay = new Intl.DateTimeFormat("nb-NO",{weekday:"long",timeZone:TZ});
const fmtDayShort = new Intl.DateTimeFormat("nb-NO",{weekday:"short",timeZone:TZ});
const fmtDate = new Intl.DateTimeFormat("nb-NO",{weekday:"short",day:"numeric",month:"short",timeZone:TZ});
const dayKey = d => new Intl.DateTimeFormat("sv-SE",{timeZone:TZ}).format(d);

let DATA = null, state = {tab:"varsel", spot:null, sel:0}, logDraft = {};

function compass(deg){
  if(deg==null) return "–";
  const n=["N","NNØ","NØ","ØNØ","Ø","ØSØ","SØ","SSØ","S","SSV","SV","VSV","V","VNV","NV","NNV"];
  return n[Math.round(((deg%360)+360)%360/22.5)%16];
}
function relDay(d){
  const today = dayKey(new Date()), k = dayKey(d);
  const tmr = dayKey(new Date(Date.now()+864e5));
  if(k===today) return "i dag";
  if(k===tmr) return "i morgen";
  return fmtDay.format(d);
}
function relDayShort(d){
  const r = relDay(d);
  if(r==="i dag" || r==="i morgen") return r;
  return fmtDayShort.format(d).replace(/\.$/,"");
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---------- Stjerner ---------- */
const STAR_PATH = "M12 2.8l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 16.8l-5.4 2.9 1-6.1L3.2 9.3l6.1-.9z";
function starsSVG(solid, faded, big){
  let out = "";
  for(let i=0;i<5;i++){
    const cls = i<solid ? "st-solid" : i<solid+faded ? "st-faded" : "st-empty";
    out += `<svg viewBox="0 0 24 24" aria-hidden="true"><path class="${cls}" d="${STAR_PATH}"/></svg>`;
  }
  const label = `${solid} av 5 stjerner` + (faded ? `, ${faded} tapt på vind eller tidevann` : "");
  return `<span class="stars r${Math.max(0,Math.min(5,solid|0))}${big?" big":""}" role="img" aria-label="${label}">${out}</span>`;
}

function favIconSvg(active){
  return `<svg viewBox="0 0 24 24" aria-hidden="true"><path class="${active?"fav-solid":"fav-outline"}" d="${STAR_PATH}"/></svg>`;
}
function isFavSpot(id){
  return !!(window.Auth && Auth.state.favorites && Auth.state.favorites.has(id));
}
function favBtnHtml(id, wrap){
  const active = isFavSpot(id);
  const inner = `<button type="button" class="fav-btn" data-fav="${esc(id)}" aria-pressed="${active}" aria-label="${active?"Fjern fra favoritter":"Legg til favoritter"}">${favIconSvg(active)}</button>`;
  return wrap ? `<div class="fav-btn-wrap">${inner}</div>` : inner;
}
async function toggleFavoriteUI(spotId){
  if(!window.Auth || !Auth.state.user){
    toast("Logg inn for å lagre favoritter", "Logg inn", ()=>{ state.tab = "innstillinger"; render(); window.scrollTo(0,0); });
    return;
  }
  try{ await Auth.toggleFavorite(spotId); }
  catch(e){ toast("Kunne ikke lagre favoritt: " + e.message); }
}
function wireFavButtons(){
  document.querySelectorAll(".fav-btn").forEach(b=>b.onclick=()=>toggleFavoriteUI(b.dataset.fav));
}

/* ---------- Beste vindu ---------- */
function bestWindow(spot){
  const hrs = spot.hours.filter(h => h.daylight !== false && new Date(h.t) >= new Date(Date.now()-36e5));
  if(!hrs.length) return null;
  // Timer der kildene er uenige (BarentsWatch-høyde, men trolig vindsjø
  // eller feil retning) skal ikke bli "beste time" hvis det finnes andre
  // timer uten den konflikten - bare fall tilbake til dem om ALT er usikkert.
  const clean = hrs.filter(h=>!h.sources_disagree);
  const pool = clean.length ? clean : hrs;
  const max = Math.max(...pool.map(h=>h.stars));
  if(max < 2) return {none:true};
  let start=null, end=null;
  for(const h of pool){
    const gap = end ? new Date(h.t) - new Date(end.t) : 0;
    if(h.stars===max && (!start || gap<=36e5)){ if(!start) start=h; end=h; }
    else if(start) break;
  }
  return {stars:max, start:new Date(start.t), end:new Date(new Date(end.t).getTime()+36e5),
    // ROADMAP oppgave B: sikkerhet (prosent) og sone for vinduets første time
    confidence: start.confidence, confidenceSource: start.confidence_source, zone: start.zone};
}
function toHourKey(d){ return d.toISOString().slice(0,13)+":00Z"; }
function bestText(spot){
  const b = bestWindow(spot);
  if(!b) return "Ingen data i lyse timer";
  if(b.none) return "Ingen brukbare vinduer de neste tre dagene";
  const anslag = b.zone==="langtid" ? " (langtid)" : (spot.bw_until && toHourKey(b.start) > spot.bw_until ? " (anslag)" : "");
  const conf = b.confidence!=null ? ` · ${b.confidence} % sikker` : "";
  return `Best ${relDay(b.start)} ${fmtHour.format(b.start)}–${fmtHour.format(b.end)}, ${b.stars} ${b.stars===1?"stjerne":"stjerner"}${anslag}${conf}`;
}
function currentHour(spot){
  const now = Date.now();
  let idx = spot.hours.findIndex(h => new Date(h.t).getTime() + 36e5 > now);
  return Math.max(0, idx);
}

/* ---------- Kommende dager ---------- */
function dayChipsHtml(spot, spotIdx){
  const days = new Map();
  spot.hours.forEach((h,i)=>{ const k = dayKey(new Date(h.t)); if(!days.has(k)) days.set(k,[]); days.get(k).push([h,i]); });
  const bw = spot.bw_until;
  const chips = [...days.values()].map(list=>{
    const d = new Date(list[0][0].t);
    const shortLbl = relDayShort(d), fullLbl = cap(relDay(d));
    const lit = list.filter(([h])=>h.daylight===true);
    if(!lit.length){
      return `<button type="button" class="daychip dark" data-spot="${spotIdx}" data-sel="${list[0][1]}" aria-label="${esc(fullLbl)}, mørkt hele dagen">
        <span class="dc-day">${esc(shortLbl)}</span><span class="dc-dark">Mørkt</span>
      </button>`;
    }
    // Samme regel som bestWindow(): en time der kildene er uenige skal ikke
    // bli "beste time" for dagen hvis det finnes andre timer uten konflikt.
    const litClean = lit.filter(([h])=>!h.sources_disagree);
    const litPool = litClean.length ? litClean : lit;
    let best = litPool[0];
    for(const pair of litPool) if(pair[0].stars > best[0].stars) best = pair;
    const [h, idx] = best;
    const good = h.stars >= 3;
    const anslag = !!(bw && h.t > bw) || h.zone==="langtid";
    const dcM = heightMForDisplay(h);
    const heightTxt = h.low_reason
      ? LOW_REASON_WORD[h.low_reason] + (dcM!=null ? ` (${nf1.format(dcM)} m)` : "")
      : (h.surf_height!=null ? nf1.format(h.surf_height)+" m" : "–");
    const heightSpoken = h.low_reason
      ? LOW_REASON_WORD[h.low_reason] + (dcM!=null ? ` (${nf1.format(dcM)} meter)` : "")
      : (h.surf_height!=null ? nf1.format(h.surf_height)+" meter" : "ingen data");
    const timeTxt = fmtHour.format(new Date(h.t));
    const cls = ["daychip", good?"good":"", anslag?"anslag":""].filter(Boolean).join(" ");
    // 06.10.2026, Theodors oppgave (andre runde): kJ også på dagbrikkene
    // (beste time) - samme svell/total-valg som energyText() andre steder.
    const dcKjVal = h.swell_offshore!=null ? h.energy_swell_kj : h.energy_total_kj;
    const dcKj = dcKjVal!=null ? `${nf0.format(dcKjVal)} kJ` : "";
    const lbl = `${fullLbl}, beste time klokka ${timeTxt.replace(/^0/,"")}, ${h.stars} av 5 stjerner, ${heightSpoken}${dcKj?`, ${dcKj}`:""}${anslag?", anslag":""}`;
    return `<button type="button" class="${cls}" data-spot="${spotIdx}" data-sel="${idx}" aria-label="${esc(lbl)}">
      <span class="dc-day">${esc(shortLbl)}</span>
      ${starsSVG(h.stars, h.faded)}
      <span class="dc-h">${esc(heightTxt)}${dcKj?` · ${esc(dcKj)}`:""}</span>
      <span class="dc-t">${esc(timeTxt)}${h.zone==="langtid"?' · langtid':(anslag?' · anslag':'')}${h.confidence!=null?` · ${h.confidence} %`:''}</span>
    </button>`;
  }).join("");
  return `<div class="daychips" role="list" aria-label="Kommende dager">${chips}</div>`;
}

function sampleBanner(){
  return DATA.sample ? `<p class="sample"><b>Oppdiktet vær, ikke dagens varsel.</b> Dette er bare for å vise hvordan appen ser ut. Ekte varsel kommer når henteren har kjørt.</p>` : "";
}

// ROADMAP oppgave G (overvåking av henteren): henteren kjører hver tredje
// time - er varselet eldre enn STALE_HOURS, har en kjøring (eller to) feilet,
// og tallene under kan være utdaterte. Vises øverst på lista OG detaljsiden.
const STALE_HOURS = 6;
function staleBanner(){
  if(DATA.sample || !DATA.generated) return "";
  const gen = new Date(DATA.generated);
  if(!(Date.now() - gen.getTime() > STALE_HOURS*36e5)) return "";
  return `<p class="warn stale" role="alert"><b>Varselet er ikke oppdatert siden ${relDay(gen)} kl. ${fmtTime.format(gen)}.</b> Henteren har trolig feilet. Tallene kan være utdaterte.</p>`;
}
/* ---------- ROADMAP oppgave C/D/K: felles små byggeklosser ---------- */
const ARROW_PATH = "M12 3l5 6h-3v12h-4V9H7z"; // pil som peker OPP (nord) i utgangspunktet
function dirArrowSVG(fromDeg, cls, title){
  // Retning er "fra"-retning (CLAUDE.md). Pila skal peke dit bølgene/vinden
  // GÅR, altså fra+180 - samme konvensjon som pilene på skiva i kartet.
  if(fromDeg==null) return `<svg class="arrow ${cls||""}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>`;
  const to = ((fromDeg+180)%360+360)%360;
  return `<svg class="arrow ${cls||""}" viewBox="0 0 24 24" aria-hidden="true"${title?` aria-label="${esc(title)}"`:""}><path d="${ARROW_PATH}" fill="currentColor" transform="rotate(${to} 12 12)"/></svg>`;
}
function ratingClass(stars){ return `rc${Math.max(0,Math.min(5,(stars|0)))}`; }
function surfRangeText(h){
  // "1,2 til 1,6 m" (surfehøyde til sett) - ROADMAP oppgave C punkt 2. For
  // 0-1 stjerne med en grunn (flatt/blåst ut/stormsjø/treffer ikke) vises
  // ordet, med den ekte høyden i parentes der den finnes (samme regel som
  // heightMForDisplay()).
  if(h.low_reason){
    const m = heightMForDisplay(h);
    return m!=null ? `${LOW_REASON_WORD[h.low_reason]} (${nf1.format(m)} m)` : LOW_REASON_WORD[h.low_reason];
  }
  if(h.surf_height==null) return h.height!=null ? `${nf1.format(h.height)} m` : "–";
  if(h.surf_height_sets!=null && h.surf_height_sets > h.surf_height + 0.05) return `${nf1.format(h.surf_height)} til ${nf1.format(h.surf_height_sets)} m`;
  return `${nf1.format(h.surf_height)} m`;
}
function kjOf(h){ return h.swell_offshore!=null ? h.energy_swell_kj : h.energy_total_kj; }
function windShort(h){
  if(h.wind_speed==null) return "";
  return `${nf0.format(h.wind_speed)} m/s ${windLabel(h)}`;
}
function dayBests(spot){
  // Beste time i brukbart lys per dag (samme regel som dagbrikkene:
  // kildene-uenige-timer bare som siste utvei). Returnerer [{key, date, h, idx, lit}].
  const days = new Map();
  spot.hours.forEach((h,i)=>{ const k = dayKey(new Date(h.t)); if(!days.has(k)) days.set(k,[]); days.get(k).push([h,i]); });
  return [...days.entries()].map(([k,list])=>{
    const lit = list.filter(([h])=>h.daylight===true);
    if(!lit.length) return {key:k, date:new Date(list[0][0].t), h:null, idx:list[0][1], lit:false};
    const clean = lit.filter(([h])=>!h.sources_disagree);
    const pool = clean.length ? clean : lit;
    let best = pool[0];
    for(const pair of pool) if(pair[0].stars > best[0].stars) best = pair;
    return {key:k, date:best[0] ? new Date(best[0].t) : new Date(list[0][0].t), h:best[0], idx:best[1], lit:true};
  });
}
function miniGraphSVG(spot, spotIdx){
  // Mini-graf på kortet: én søyle per dag (beste time i lyse timer), høyde =
  // stjerner, farge = rating. Dagene etter dag 7 (langtid) blekere. Trykk på
  // en søyle går til den timen (samme som dagbrikkene gjorde før).
  const bests = dayBests(spot).slice(0, 16);
  const W = 100 * bests.length / 16 * 3.6, H = 50, colW = 360 / 16, barW = colW - 6, base = 36;
  const bars = bests.map((b,i)=>{
    const st = b.h ? b.h.stars : 0;
    const hgt = Math.max(3, st * 6);
    const x = i * colW + 3;
    const lang = b.h && b.h.zone==="langtid";
    const lbl = fmtDayShort.format(b.date).replace(/\.$/,"");
    const aria = b.h ? `${cap(relDay(b.date))}: ${st} av 5 stjerner${b.h.surf_height!=null?`, ${nf1.format(b.h.surf_height)} m`:""}` : `${cap(relDay(b.date))}: mørkt`;
    return `<g class="mini-bar" data-spot="${spotIdx}" data-sel="${b.idx}" role="listitem" aria-label="${esc(aria)}">
      <rect x="${x}" y="${base-hgt}" width="${barW}" height="${hgt}" rx="2" fill="var(--r${st})"${lang?' opacity=".5"':""}${b.lit?"":' opacity=".25"'}/>
      <text x="${x+barW/2}" y="${H-2}" text-anchor="middle" font-size="9" fill="var(--muted)">${esc(lbl)}</text>
    </g>`;
  }).join("");
  const brk = bests.findIndex(b=>b.h && b.h.zone==="langtid");
  const brkLine = brk > 0 ? `<line x1="${brk*colW}" y1="4" x2="${brk*colW}" y2="${base}" stroke="var(--line)" stroke-dasharray="3 2"/>` : "";
  return `<svg class="mini" viewBox="0 0 360 ${H}" preserveAspectRatio="none" role="list" aria-label="Beste rating per dag, 16 dager">${brkLine}${bars}</svg>`;
}

function renderList(){
  const gen = new Date(DATA.generated);
  const order = DATA.spots.map((s,i)=>i).sort((a,b)=>{
    const fa = isFavSpot(DATA.spots[a].id) ? 0 : 1;

    return fa - fb;
  });
  const cards = order.map(i=>{
    const s = DATA.spots[i];
    const h = s.hours[currentHour(s)];

    // Stripa viser DAGENS beste rating (ROADMAP C punkt 2), tallene viser nå.
    const today = dayBests(s).find(b=>b.key===dayKey(new Date()));
    const bestToday = today && today.h ? today.h.stars : h.stars;
    const kj = kjOf(h);

    return `<div class="card ${ratingClass(bestToday)}">

        <div class="c-facts">
          ${kj!=null?`<span class="f">${nf0.format(kj)} kJ</span>`:""}
          ${h.period!=null?`<span class="f">${nf0.format(h.period)} s</span>`:""}
          ${h.wind_speed!=null?`<span class="f">${dirArrowSVG(h.wind_dir, windCls, "vind fra "+compass(h.wind_dir))}${esc(windShort(h))}</span>`:""}
          ${h.uncertain && !h.low_reason ? `<span class="f">usikkert</span>` : ""}
        </div>
        <div class="c-best">${esc(bestText(s))}</div>

  $("#app").innerHTML = `${sampleBanner()}${staleBanner()}

    <div class="cards">${cards}</div>`;
  document.querySelectorAll(".card-btn").forEach(b=>b.onclick=()=>{

    state.spot = +g.dataset.spot; state.sel = +g.dataset.sel; state.scrollToSel = true; render(); window.scrollTo(0,0);

  wireFavButtons();

// 26.09.2026: surfehøyde (der bølgene brekker) er nå det man ser først -
// "height" (Hs, signifikant høyde ute) er bare forklaringen bak tallet, se
// README "Surfehøyde".
function surfHeadline(h){
  // 05.10.2026 (Theodors rettelse, Grøtfjord kl. 11-17 - se STATUS.md): ett
  // samlende felt (low_reason) i stedet for å sjekke blown_out/likely_flat
  // hver for seg - se fetcher/rating.classify_low_rating(). Viser den ekte
  // høyden ved siden av ordet for blåst ut/stormsjø (punkt c), ikke bare
  // "Trolig flatt" som før.
  if(h.low_reason){
    const m = heightMForDisplay(h);
    return m!=null ? `${LOW_REASON_WORD[h.low_reason]} (${nf1.format(m)} m)` : LOW_REASON_WORD[h.low_reason];
  }
  if(h.surf_height==null) return h.height!=null ? `${nf1.format(h.height)} m` : "–";
  const sets = h.surf_height_sets!=null ? `, sett ${nf1.format(h.surf_height_sets)} m` : "";
  return `${nf1.format(h.surf_height)} m${sets}`;
}
function surfSubtext(h){
  if(h.height==null) return "Ingen data";
  const period = h.period!=null ? `${nf0.format(h.period)} s` : "ukjent periode";
  if(h.height_source==="barentswatch"){
    const interp = h.bw_interpolated ? " (interpolert)" : "";
    // 27.09.2026 (Theodors rettelse, Unstad for lav - se STATUS.md): tallet
    // vi viser i "v" over (surfHeadline) er justert (svellandel, periode,
    // retning ved punktet) - skal ALDRI kalles "signifikant" alene, det
    // begrepet gjelder BarentsWatch sin EGNE totalhøyde (bw_height). Selve
    // justeringen vises i en egen linje, se surfAdjustmentLine().
    return h.bw_height!=null
      ? `BarentsWatch ${nf1.format(h.bw_height)} m signifikant, ${period}${interp}`
      : `${nf1.format(h.height)} m, ${period}, BarentsWatch${interp}`;
  }
  return `${nf1.format(h.height)} m signifikant, ${period}, anslag`;
}
function bwPeriodFactor(period){
  // Speiler rating.bw_period_factor() - bare til å avgjøre HVILKET ledd
  // (svellandel eller periode) som faktisk er det begrensende i min()
  // under, til visning. Endrer aldri noe tall selv.
  if(period==null) return 1.0;
  if(period<6) return 0.3;
  if(period<8) return 0.3+0.3*(period-6)/2;
  return 1.0;
}
function surfAdjustmentLine(h){
  // 27.09.2026 (Theodors rettelse): egen linje for selve justeringen fra
  // BarentsWatch sin totalhøyde til den brukte høyden - bare leddene som
  // FAKTISK trekker ned (min(svellandel, periodefaktor) - bare den minste
  // av de to er den reelle årsaken, og retningen bare hvis den ikke er 1,0).
  if(h.height_source!=="barentswatch" || h.bw_height==null || h.height==null) return "";
  const share = h.swell_share, pf = bwPeriodFactor(h.bw_period), dirfac = h.spot_direction_factor;
  const shareOk = share==null || share>=0.999, pfOk = pf>=0.999, dirOk = dirfac==null || dirfac>=0.999;
  if(shareOk && pfOk && dirOk) return "";
  const reasons = [];
  if(!shareOk && (pfOk || share<=pf)) reasons.push(`svellandel ${Math.round(share*100)} %`);
  else if(!pfOk) reasons.push("kort BarentsWatch-periode");
  if(!dirOk) reasons.push(h.spot_direction_diff!=null ? `retning ${Math.round(h.spot_direction_diff)}° skrått ved punktet` : "retning ved punktet");
  return `Etter justering ${nf1.format(h.height)} m (${reasons.join(", ")})`;
}
const SURF_HEIGHT_EXPLAINER = "Surfehøyde er høyden der bølgene brekker, regnet ut fra bølgehøyde og periode (Komar og Gaughan, 1972). Signifikant høyde er gjennomsnittet ute i vannet - langt svell reiser seg mer når det treffer grunnen.";
// 06.10.2026, Theodors oppgave (andre runde): samme tekst Theodor selv
// formulerte, ordrett - erstatter den første versjonen av denne teksten.
const ENERGY_EXPLAINER = "Energi i bølgene ute. Lang periode gir mye mer energi og kraft, selv med samme høyde.";
// ROADMAP oppgave I (skjerming), 06.10.2026 natt: statisk per spot (ikke per
// time) - hvor åpen spoten er mot havet, før noe er lært fra BarentsWatch

const SHELTER_EXPLAINER = "Hvor åpen spoten er mot havet, før noe er lært fra BarentsWatch eller loggene dine. Lang periode diffrakterer (bøyer seg) bedre rundt odder og inn fjorder enn kort periode, så skjermingen teller mindre for langt svell.";
function localRulesHtml(h){

    </div>`;
}
function energyText(h){

function directionHitText(h){

function offshoreShareText(h){

function uteDirectionText(h, spot){

function vedSpotenDirectionText(h){

function nextTide(spot, t){

}
function lightClass(x){

function lightText(spot, t){

    n: d.sun ? "Fra skumring til skumring" : "Mørketid, bare skumring"};

/* ---------- Detaljsiden (ROADMAP oppgave C punkt 3, D og K) ---------- */
function surfGraphSVG(s, selIdx){
  // Surfehøyde over 16 dager: søyle per time de første 7 dagene, per dag
  // etterpå (langtid, blekere), farget etter rating, sett-høyde som tynnere
  // søyle over, lys (dag/skumring/mørkt) som bakgrunn, trykk velger time.
  // Vannrett rullbar (samme mønster som den gamle timestripa) - 7 døgn med
  // timesøyler får ikke plass på en telefonskjerm uten å bli uleselige.
  const COLW = 14, DAYW = 44, H = 200, top = 22, base = 170, padL = 30;
  const items = [];
  const langDays = new Map();
  s.hours.forEach((h,i)=>{
    if(h.zone==="langtid"){
      const k = dayKey(new Date(h.t));
      if(!langDays.has(k)) langDays.set(k, {key:k, hours:[]});
      langDays.get(k).hours.push([h,i]);
    } else items.push({kind:"hour", h, i, w:COLW});
  });
  for(const d of langDays.values()){
    const lit = d.hours.filter(([h])=>h.daylight!==false);
    const pool = lit.length ? lit : d.hours;
    let best = pool[0]; for(const p of pool) if(p[0].stars > best[0].stars) best = p;
    items.push({kind:"day", h:best[0], i:best[1], w:DAYW, all:d.hours.map(x=>x[0])});
  }
  const maxM = Math.max(1.5, ...s.hours.map(h=>Math.max(h.surf_height_sets||0, h.surf_height||0, heightMForDisplay(h)||0)));
  const scale = (base - top - 8) / maxM;
  const W = padL + items.reduce((a,it)=>a+it.w, 0) + 10;
  let x = padL, out = "", dayLabels = "", bgs = "", breaks = "";
  let lastDay = null, selX = null;
  items.forEach(it=>{
    const h = it.h;
    const d = new Date(h.t), k = dayKey(d);
    if(k !== lastDay){
      dayLabels += `<text class="g-day" x="${x+2}" y="14">${esc(it.kind==="day" ? fmtDate.format(d).replace(/\.$/,"") : relDay(d))}</text>`;
      if(lastDay!==null) breaks += `<line class="g-grid" x1="${x-1}" y1="${top}" x2="${x-1}" y2="${base}"/>`;
      lastDay = k;
    }
    // lys-bakgrunn (f)
    const light = h.light || (h.daylight===false ? "mørkt" : "dag");
    if(light!=="dag") bgs += `<rect class="${light==="mørkt"?"g-bg-dark":"g-bg-dusk"}" x="${x}" y="${top}" width="${it.w}" height="${base-top}"/>`;
    const m = h.low_reason ? (h.low_reason==="blown_out"||h.low_reason==="stormsjo" ? heightMForDisplay(h) : 0) : h.surf_height;
    const sets = h.low_reason ? null : h.surf_height_sets;
    const hgt = m!=null ? Math.max(m>0?3:1.5, m*scale) : 1.5;
    const sel = it.i===selIdx || (it.kind==="day" && it.all.some(a=>s.hours[selIdx]===a));
    if(sel) selX = x;
    const bw = it.kind==="day" ? it.w-10 : it.w-4;
    const bx = x + (it.w-bw)/2;
    const setsRect = sets!=null && sets > (m||0) ? `<rect x="${bx+bw*0.3}" y="${base-sets*scale}" width="${bw*0.4}" height="${(sets-(m||0))*scale}" rx="1.5" fill="var(--r${h.stars})" opacity=".45"/>` : "";
    const lbl = it.kind==="day" ? fmtDayShort.format(d).replace(/\.$/,"") : fmtHour.format(d);
    const aria = `${relDay(d)} kl. ${fmtHour.format(d)}: ${h.stars} av 5 stjerner, ${surfRangeText(h)}${h.zone==="langtid"?", langtid":""}${h.confidence!=null?`, ${h.confidence} % sikker`:""}`;
    out += `<g class="g-bar${sel?" sel":""}${it.kind==="day"?" g-lang":""}" data-i="${it.i}" role="button" tabindex="0" aria-label="${esc(aria)}" aria-pressed="${sel}">
      <rect x="${x}" y="${top}" width="${it.w}" height="${base-top+16}" fill="transparent"/>
      ${setsRect}
      <rect class="main" x="${bx}" y="${base-hgt}" width="${bw}" height="${hgt}" rx="2" fill="var(--r${h.stars})"${h.zone==="reserve"?' opacity=".8"':""}/>
      ${(it.kind==="day" || (d.getUTCHours()%3===0)) ? `<text class="g-hl" x="${x+it.w/2}" y="${base+13}" text-anchor="middle">${esc(lbl)}</text>` : ""}
    </g>`;
    x += it.w;
  });
  const ticks = [];
  for(let v=0.5; v<=maxM; v+=0.5) ticks.push(`<line class="g-grid" x1="${padL}" y1="${base-v*scale}" x2="${W}" y2="${base-v*scale}"/><text class="g-tick" x="${padL-4}" y="${base-v*scale+3}" text-anchor="end">${nf1.format(v)}</text>`);
  const nowIdx = currentHour(s);
  let nx = padL; for(const it of items){ if(it.i===nowIdx) break; nx += it.w; }
  const nowLine = `<line class="g-now" x1="${nx}" y1="${top}" x2="${nx}" y2="${base}"/>`;
  const bwUntil = s.bw_until ? items.findIndex(it=>it.h.t > s.bw_until) : -1;
  let bx2 = padL; for(let j=0;j<bwUntil;j++) bx2 += items[j].w;
  const bwLine = bwUntil>0 ? `<line class="g-break" x1="${bx2}" y1="${top}" x2="${bx2}" y2="${base}"/><text class="g-tick" x="${bx2+3}" y="${base-2}">anslag →</text>` : "";
  return {svg:`<svg class="graph" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="group" aria-label="Surfehøyde per time, 16 dager">${bgs}${ticks.join("")}${breaks}${bwLine}${nowLine}${dayLabels}${out}</svg>`, selX, width:W};
}

function tideCurveSVG(s, t, h){
  // Tidevannskurve over den valgte dagen (lokal tid), cosinus-interpolert
  // mellom Kartverkets flo/fjære-tidspunkt, med nå/valgt time markert.
  const ev = (s.tide_events||[]).map(e=>({t:new Date(e.time).getTime(), cm:e.cm, type:e.type})).sort((a,b)=>a.t-b.t);
  if(ev.length < 2) return "";
  const dayStart = new Date(t); // lokal midnatt for valgt dag
  const parts = new Intl.DateTimeFormat("sv-SE",{timeZone:TZ, hour:"2-digit", minute:"2-digit", hourCycle:"h23"}).formatToParts(t);
  const hh = +parts.find(p=>p.type==="hour").value, mm = +parts.find(p=>p.type==="minute").value;
  const start = t.getTime() - (hh*60+mm)*60000, end = start + 864e5;
  const level = (ms)=>{
    let a = null, b = null;
    for(const e of ev){ if(e.t<=ms) a = e; if(e.t>ms){ b = e; break; } }
    if(!a || !b) return null;
    const f = (ms - a.t) / (b.t - a.t);
    return a.cm + (b.cm - a.cm) * (1 - Math.cos(Math.PI*f)) / 2;
  };
  const W = 360, H = 96, padL = 30, padR = 8, top = 10, base = 72;
  const cms = []; for(let ms=start; ms<=end; ms+=15*60000){ const v = level(ms); if(v!=null) cms.push(v); }
  if(!cms.length) return "";
  const lo = Math.min(...cms, ...ev.filter(e=>e.t>=start&&e.t<=end).map(e=>e.cm)), hi = Math.max(...cms, ...ev.filter(e=>e.t>=start&&e.t<=end).map(e=>e.cm));
  const xOf = ms => padL + (ms-start)/864e5*(W-padL-padR);
  const yOf = cm => base - (cm-lo)/Math.max(1,hi-lo)*(base-top);
  let d = "", first = true;
  for(let ms=start; ms<=end; ms+=15*60000){ const v = level(ms); if(v==null) continue; d += `${first?"M":"L"}${xOf(ms).toFixed(1)},${yOf(v).toFixed(1)} `; first = false; }
  const marks = ev.filter(e=>e.t>=start && e.t<=end).map(e=>`<circle cx="${xOf(e.t).toFixed(1)}" cy="${yOf(e.cm).toFixed(1)}" r="3" fill="var(--wind)"/><text x="${xOf(e.t).toFixed(1)}" y="${e.type==="flo"?yOf(e.cm)-7:yOf(e.cm)+13}" text-anchor="middle">${e.type} ${fmtTime.format(new Date(e.t))}</text>`).join("");
  const nowX = xOf(Math.min(end, Math.max(start, t.getTime()+18e5)));
  const hours = [0,6,12,18,24].map(hr=>`<text x="${xOf(start+hr*36e5).toFixed(1)}" y="${H-2}" text-anchor="${hr===0?"start":hr===24?"end":"middle"}">${String(hr).padStart(2,"0")}</text>`).join("");
  return `<svg class="tide-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tidevann ${relDay(t)}: ${h.tide?`${h.tide.rising?"stigende":"fallende"}, ${h.tide.state}`:""}">
    <path class="t-fill" d="${d}L${xOf(end).toFixed(1)},${base} L${padL},${base} Z"/>
    <path class="t-curve" d="${d}"/>
    <line class="t-now" x1="${nowX.toFixed(1)}" y1="${top}" x2="${nowX.toFixed(1)}" y2="${base}"/>
    ${marks}${hours}
    <text x="${padL-4}" y="${top+4}" text-anchor="end">${hi}</text><text x="${padL-4}" y="${base+2}" text-anchor="end">${lo} cm</text>
  </svg>`;
}

function noticeHtml(h){
  // ROADMAP oppgave K punkt 6: advarsler som ÉN kort linje øverst, med
  // forklaring ved trykk (samme ord som ellers - low_reason/sources_disagree).
  if(h.low_reason==="blown_out") return `<button type="button" class="notice bad" data-explain="wind"><b>Blåst ut.</b> ${h.wind_speed!=null?`${nf0.format(h.wind_speed)} m/s ${windLabel(h)}`:"Sterk vind"} tar stjernene.${h.bw_height!=null?` BarentsWatch måler ${nf1.format(h.bw_height)} m.`:""}</button>`;
  if(h.low_reason==="stormsjo") return `<button type="button" class="notice bad" data-explain="swell"><b>Stormsjø.</b> Mest vindsjø, ikke ekte svell${h.swell_share!=null?` (${Math.round(h.swell_share*100)} % svell)`:""}.</button>`;
  if(h.low_reason==="treffer_ikke") return `<button type="button" class="notice bad" data-explain="direction"><b>Treffer ikke.</b> Svellet fra ${compass(h.dir_offshore)} (${h.dir_offshore!=null?Math.round(h.dir_offshore):"–"}°) kommer utenfor vinduet.</button>`;
  if(h.sources_disagree) return `<button type="button" class="notice bad" data-explain="sources"><b>Kildene er uenige.</b> ${esc((h.sources_disagree_reason||"").replace(/^Kildene er uenige\.\s*/, "").split(". ")[0])}.</button>`;
  if(h.height_source==="barentswatch") return `<button type="button" class="notice ok" data-explain="sources"><b>Høyden er fra BarentsWatch</b>${h.bw_interpolated?", interpolert":""}. Mest pålitelige kilde.</button>`;
  if(h.height_source==="svell_ute" && h.directness!=null && h.directness < 1) return `<button type="button" class="notice" data-explain="direction"><b>Svell ${h.directness<0.667?"utenfor":"i kanten av"} vinduet.</b> ${nf0.format(h.directness*100)} % av høyden ved direkte treff når inn.</button>`;
  if(h.uncertain) return `<button type="button" class="notice" data-explain="confidence"><b>Usikkert varsel, maks 3 stjerner.</b> Anslag til BarentsWatch er koblet på.</button>`;
  return "";
}

        <div class="cell"><div class="k tap" data-explain="period">Periode</div><div class="v">${h.period!=null?nf0.format(h.period)+" s":"–"}</div><div class="n">Open-Meteo${h.bw_period!=null?` · BarentsWatch ${nf1.format(h.bw_period)} s ved punktet`:""}</div></div>

        <div class="cell wide"><div class="k tap" data-explain="sources">Kilder</div><div class="v" style="font-size:16px">${h.height_source==="barentswatch"?"BarentsWatch ved spoten":h.height_source==="svell_ute"?"Reservemodell (svell ute × transfer × eksponering)":h.height_source==="metno_korrigert"?"met.no, justert":"–"}</div><div class="n">${s.bw_until?`BarentsWatch til ${esc(s.bw_until.replace("T"," kl. ").replace("Z"," UTC"))}`:"Ingen BarentsWatch for denne spoten"} · vind ${h.wind_source==="openmeteo"?"Open-Meteo GFS":"met.no"} · tidevann Kartverket</div></div>
      </div>
      ${localRulesHtml(h)}
      <p class="sub" style="margin:10px 0 0">Kalibrering (transfer, surf-faktor, eksponering lært) ligger under <a href="#" id="gotoLogger">Logger</a>.</p>
    </details>
    <h2 class="sec">Rapporter fra andre</h2>
    <div class="reports" id="reportsSection"><p style="color:var(--muted);padding:14px 0">Laster…</p></div>`;

  $("#back").onclick = ()=>{ state.spot=null; render(); };
  wireFavButtons();
  $("#bdOpen").onclick = ()=>openBreakdown(h);
  const gl = $("#gotoLogger"); if(gl) gl.onclick = (e)=>{ e.preventDefault(); state.tab = "logger"; render(); window.scrollTo(0,0); };
  document.querySelectorAll(".g-bar").forEach(b=>{
    const go = ()=>{ const x = $("#graphWrap").scrollLeft; state.sel=+b.dataset.i; renderSpot(); $("#graphWrap").scrollLeft = x; };
    b.onclick = go;
    b.onkeydown = (ev)=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); go(); } };
  });
  if(state.scrollToSel || state.graphScrollInit!==state.spot){
    state.scrollToSel = false; state.graphScrollInit = state.spot;
    if(g.selX!=null) $("#graphWrap").scrollLeft = Math.max(0, g.selX - 120);
  }
  wireExplain(document, h, s);
  loadReportsUI(s.id);
}

async function loadReportsUI(spotId){
  const el = $("#reportsSection");
  if(!el) return;
  const a = window.Auth && Auth.state;
  if(!a || !a.ready){ el.innerHTML = `<p style="color:var(--muted);padding:14px 0">Laster…</p>`; return; }
  let listHtml = "";
  if(a.user){
    const reports = await Auth.listReports(spotId);
    listHtml = reports.length ? reports.map(reportItemHtml).join("") : `<p style="color:var(--muted);padding:14px 0">Ingen rapporter ennå.</p>`;
  }
  if($("#reportsSection") !== el) return; // spot byttet mens vi ventet
  el.innerHTML = listHtml + reportFormHtml();
  const gk = $("#gotoKonto");
  if(gk) gk.onclick = (e)=>{ e.preventDefault(); state.tab = "innstillinger"; render(); window.scrollTo(0,0); };
  const send = $("#reportSend");
  if(send) send.onclick = async ()=>{
    const text = $("#reportText").value.trim();
    if(!text) return;
    const wave = $("#reportWave").value ? parseFloat($("#reportWave").value) : null;
    const wind = $("#reportWind").value || null;
    send.disabled = true;
    try{ await Auth.postReport(spotId, text, wave, wind); await loadReportsUI(spotId); toast("Rapport delt"); }
    catch(e){ toast("Kunne ikke dele rapport: " + e.message); send.disabled = false; }
  };
  document.querySelectorAll(".report-del").forEach(b=>b.onclick=async ()=>{
    if(!confirm("Slette denne rapporten?")) return;
    try{ await Auth.deleteReport(b.dataset.id); await loadReportsUI(spotId); }
    catch(e){ toast("Kunne ikke slette: " + e.message); }
  });
}

/* ---------- Logger ---------- */
function loadLogs(){ try{ return JSON.parse(localStorage.getItem(LOG_KEY)) || []; }catch(e){ return []; } }
function saveLogs(l){ try{ localStorage.setItem(LOG_KEY, JSON.stringify(l)); return true; }catch(e){ return false; } }

// Del B (ROADMAP oppgave 4): eksponering per retning, lært fra BarentsWatch
// og blandet med den geometriske kurven fra del C - se fetcher/exposure_learn.py.
// Fargeskala 0-5 stjerner, uavhengig av rav-fargen (--star) som ellers
// betyr "stjerner" i appen - her trengs en skala, ikke en enkeltfarge.
const STAR_SCALE = ["#c0392b","#e0672c","#e0a72c","#c9c22b","#7fbf3f","#2f9e44"];
function exposureChartSVG(spotId, curve, logs){
  if(!curve) return "";
  const W = 380, H = 130, padL = 26, padR = 8, padT = 6, plotH = 84, axisY = padT + plotH;
  const bx = i => padL + (i + 0.5) * (W - padL - padR) / 36;
  const by = v => axisY - v * plotH;
  const path = (key) => curve.map((c,i)=>c[key]!=null ? `${bx(i)},${by(c[key])}` : null).filter(Boolean);
  const geoPts = curve.map((c,i)=>`${bx(i)},${by(c.geometric)}`).join(" ");
  const langPts = path("learned_lang");
  const kortPts = path("learned_kort");
  const maxPairs = Math.max(1, ...curve.map(c=>Math.max(c.pairs_lang||0, c.pairs_kort||0)));
  const bars = curve.map((c,i)=>{
    const n = Math.max(c.pairs_lang||0, c.pairs_kort||0);
    if(!n) return "";
    const h = 14 * Math.min(1, n / maxPairs);
    const w = (W - padL - padR) / 36 - 2;
    return `<rect x="${bx(i)-w/2}" y="${H-14+ (14-h)}" width="${w}" height="${h}" fill="var(--muted)" opacity=".35"/>`;
  }).join("");
  const dots = (pts, color) => pts.map(p=>`<circle cx="${p.split(",")[0]}" cy="${p.split(",")[1]}" r="2.6" fill="${color}"/>`).join("");
  const marks = (logs||[]).filter(l=>l.spot===spotId && l.dirOffshore!=null && l.stars!=null).map(l=>{
    const i = Math.floor((l.dirOffshore % 360) / 10);
    return `<circle cx="${bx(i)}" cy="${axisY+6}" r="3" fill="${STAR_SCALE[Math.max(0,Math.min(5,l.stars))]}"><title>${l.stars} stjerner</title></circle>`;
  }).join("");
  const ticks = [0,90,180,270].map(d=>{
    const i = d/10;
    return `<text x="${bx(i)}" y="${H-1}" font-size="9" fill="var(--muted)" text-anchor="middle">${d}°</text>`;
  }).join("");
  const yTicks = [0,0.5,1].map(v=>`<text x="${padL-4}" y="${by(v)+3}" font-size="9" fill="var(--muted)" text-anchor="end">${v}</text>`).join("");
  return `<svg class="expo-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Eksponering per retning">
    <line x1="${padL}" y1="${axisY}" x2="${W-padR}" y2="${axisY}" stroke="var(--line)"/>
    ${bars}
    <polyline points="${geoPts}" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="3 2"/>
    ${langPts.length>1 ? `<polyline points="${langPts.join(" ")}" fill="none" stroke="#2f6fed" stroke-width="1.8"/>` : ""}
    ${dots(langPts, "#2f6fed")}
    ${dots(kortPts, "#e08b2f")}
    ${marks}
    ${ticks}${yTicks}
  </svg>`;
}

function forecastAt(spotId, t){
  const s = DATA.spots.find(x=>x.id===spotId); if(!s) return null;
  const key = new Date(Math.floor(t.getTime()/36e5)*36e5).toISOString().slice(0,13)+":00Z";
  return s.hours.find(h=>h.t===key) || null;
}

function renderLogs(){
  const logs = loadLogs().sort((a,b)=>b.t.localeCompare(a.t));
  const calib = DATA.spots.map(s=>{
    const withF = logs.filter(l=>l.spot===s.id && l.forecastStars!=null);
    if(!withF.length) return `<div class="calib"><div class="t">${esc(s.name)}</div><p>Ingen logger med varsel å sammenligne mot ennå.</p></div>`;
    const hits = withF.filter(l=>Math.abs(l.stars-l.forecastStars)<=1).length;
    const bias = withF.reduce((a,l)=>a+(l.stars-l.forecastStars),0)/withF.length;
    const dir = Math.abs(bias)<0.5 ? "Varselet ligger omtrent riktig." : bias>0 ? `Varselet undervurderer med ${nf1.format(bias)} stjerner i snitt.` : `Varselet overvurderer med ${nf1.format(-bias)} stjerner i snitt.`;
    return `<div class="calib"><div class="t">${esc(s.name)}: traff ${hits} av ${withF.length}</div><p>${dir} Treff betyr innenfor én stjerne.</p></div>`;
  }).join("");
  // 26.09.2026: transfer (modell mot modell, reserven mot BarentsWatch -
  // læres ALDRI fra loggene lenger) og surf_factor (loggene/observasjonene
  // dine mot Komar og Gaughan sin bruddhøyde-formel) er to adskilte tall,
  // som ikke skal blandes - se README "Surfehøyde".
  const heightCal = DATA.spots.map(s=>{
    const cal = s.calibration || {};
    const transferPct = nf0.format((cal.transfer_used ?? (s.hours[0]||{}).transfer ?? 0.6) * 100);
    const transferSrcTxt = cal.transfer_source==="eksponering" ? `Lært fra eksponeringen per retning (del B, ${cal.exposure_buckets_learned_lang} bøtter)`
      : cal.transfer_source==="barentswatch" ? `Lært fra BarentsWatch (${cal.bw_pairs} par over ${cal.bw_days} døgn)`
      : cal.transfer_source==="spots.json" ? "Satt i spots.json"
      : cal.transfer_source==="logs" ? "Lært fra loggene dine"
      : cal.transfer_source==="skjerming" ? "Geometrisk startverdi fra skjerming (ROADMAP oppgave I), ikke lært ennå"
      : "Standardverdi";
    const surfFactor = cal.surf_factor_used ?? 1.0;
    const surfLogs = cal.surf_factor_logs ?? 0;
    const surfSrcTxt = cal.surf_factor_source==="logs"
      ? `Lært fra ${surfLogs} logger/observasjoner du har lagt inn`
      : cal.surf_factor_source==="prior"
      ? `Startverdi${cal.surf_factor_prior_n!=null?` fra ${cal.surf_factor_prior_n} observasjoner`:""} (ikke lært fra logger ennå - ${Math.max(0,MIN_SIZE_LOGS-surfLogs)} til med størrelse og retning rett inn så overstyrer det)`
      : `Standardverdi (${Math.max(0,MIN_SIZE_LOGS-surfLogs)} til med størrelse og retning rett inn før den læres automatisk)`;
    return `<div class="calib"><div class="t">${esc(s.name)}</div>
      <p><b>Transfer ${transferPct} %</b>: hvor mye av svellet ute som når stranda ved direkte treff, modell mot modell (reservemodellen mot BarentsWatch). ${transferSrcTxt}.</p>
      <p><b>Surf-faktor ${nf1.format(surfFactor)}</b>: hvor godt Komar og Gaughan sin bruddhøyde-formel stemmer med det du faktisk ser her. ${surfSrcTxt}.</p></div>`;
  }).join("");
  // Del B (ROADMAP oppgave 4): eksponering lært fra BarentsWatch, per
  // 10-graders bøtte, blandet med den geometriske kurven fra del C. Grå
  // stiplet linje er geometrien alene (uendret), blå er lært for lang
  // periode (10 s og over), oransje prikker lært for kort periode - se
  // fetcher/exposure_learn.py sin modul-docstring for hele metoden.
  const exposureCal = DATA.spots.map(s=>{
    const cal = s.calibration || {};
    const curve = cal.exposure_curve;
    if(!curve){
      return `<div class="calib"><div class="t">${esc(s.name)}</div><p>Ingen geometrisk eksponeringsdata bygget ennå (fetcher/exposure_baseline.py må kjøres manuelt).</p></div>`;
    }
    const pairs = cal.exposure_pairs ?? 0;
    const bucketsLang = cal.exposure_buckets_learned_lang ?? 0;
    const bucketsKort = cal.exposure_buckets_learned_kort ?? 0;
    const sugg = (cal.exposure_override_suggestions || []).map(o=>
      `<div class="sugg">Retning ${o.from}-${o.to}°: lært eksponering (${nf1.format(o.learned_max)}) ligger allerede under taket (${nf1.format(o.cap)}) i spots.json. Vurder å fjerne exposure_override for denne sektoren - fjernes aldri automatisk.</div>`
    ).join("");
    return `<div class="calib"><div class="t">${esc(s.name)}: ${pairs} par, ${bucketsLang} bøtter lært (lang periode), ${bucketsKort} (kort)</div>
      <p>Eksponering per retning - hvor mye av svellet ute som når spoten. Stiplet grå: geometrien alene (del C). Blå linje/prikker: lært for lang periode. Oransje prikker: lært for kort periode. Prikkene langs bunnen er dine egne logger, farget etter stjerner.</p>
      ${exposureChartSVG(s.id, curve, logs)}
      <div class="expo-legend">
        <span><i style="background:var(--muted);opacity:.6"></i>Geometri</span>
        <span><i style="background:#2f6fed"></i>Lært, lang periode</span>
        <span><i style="background:#e08b2f"></i>Lært, kort periode</span>
      </div>
      ${sugg}</div>`;
  }).join("");
  // Hvilket BarentsWatch-punkt (250 m, brukt i varselet, eller 150 m, det
  // opprinnelige) som faktisk ligger nærmest det du har logget. Bytter
  // ALDRI punkt selv - bare til orientering.
  const bwCompare = DATA.spots.map(s=>{
    const withSize = logs.filter(l=>l.spot===s.id && l.size && SIZE_M[l.size]!=null);
    if(withSize.length < MIN_SIZE_LOGS){
      const left = MIN_SIZE_LOGS - withSize.length;
      return `<div class="calib"><div class="t">${esc(s.name)}</div><p>Trenger ${left} økt${left===1?"":"er"} til med størrelse valgt for å sammenligne BarentsWatch-punktene.</p></div>`;
    }
    const withBoth = withSize.filter(l=>l.bwHeight!=null && l.bwHeightNear!=null && l.forecastPeriod!=null);
    if(!withBoth.length){
      return `<div class="calib"><div class="t">${esc(s.name)}</div><p>Ingen av de ${withSize.length} øktene med størrelse har data fra begge punktene ennå.</p></div>`;
    }
    const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
    const dev250 = avg(withBoth.map(l=>Math.abs(SIZE_M[l.size]-breakingHeight(l.bwHeight,l.forecastPeriod))));
    const dev150 = avg(withBoth.map(l=>Math.abs(SIZE_M[l.size]-breakingHeight(l.bwHeightNear,l.forecastPeriod))));
    const better = dev250<=dev150 ? "250 m" : "150 m";
    return `<div class="calib"><div class="t">${esc(s.name)}: ${better}-punktet ligger nærmest det du har logget</div>
      <p>Snittavvik fra ${withBoth.length} økter: 250 m-punktet ${nf1.format(dev250)} m, 150 m-punktet ${nf1.format(dev150)} m. Varselet bruker fortsatt 250 m-punktet - bytt manuelt i spots.json om du vil.</p></div>`;
  }).join("");
  // Hvor ofte timer der kildene var uenige (BarentsWatch-høyde, men trolig
  // vindsjø eller feil retning ved spoten - kappet til maks 1 stjerne)
  // faktisk ble logget som surfbare. Mange treff her tyder på at regelen
  // er for streng.
  const disagreeStats = DATA.spots.map(s=>{
    const flagged = logs.filter(l=>l.spot===s.id && l.sourcesDisagree);
    if(!flagged.length){
      return `<div class="calib"><div class="t">${esc(s.name)}</div><p>Ingen økter logget når kildene var uenige ennå.</p></div>`;
    }
    const surfable = flagged.filter(l=>l.stars>=2).length;
    return `<div class="calib"><div class="t">${esc(s.name)}: ${surfable} av ${flagged.length} var surfbare likevel</div>
      <p>Gjelder økter logget mens BarentsWatch-høyden trolig var mest vindsjø eller ikke traff stranda. Mange treff her betyr at regelen kanskje er for streng.</p></div>`;
  }).join("");
  // 06.10.2026, Theodors oppgave (Magnus, lokal surfer - se CLAUDE.md
  // "Lokalkunnskap"): foreslå å myke opp en lokal regel når minst 3 gode
  // logger (3 stjerner eller mer) BRYTER den samme regelen - det er et tegn
  // på at terskelen er strengere enn det du faktisk opplever. Samme mønster
  // som disagreeStats over (og exposure_override_suggestions): bare et
  // forslag, ENDRER ALDRI spots.json sin local_rules selv. Eldre logger uten
  // tideState/energyTotalKj telles bare ikke med (samme mønster som
  // dirOffshore - "figuren viser dem bare ikke").
  const LOCAL_RULE_SUGGEST_MIN = 3;
  const localRuleStats = DATA.spots.filter(s=>s.local_rules).map(s=>{
    const lr = s.local_rules, good = logs.filter(l=>l.spot===s.id && l.stars>=3);
    const items = [];
    const zero = lr.min_energy_kj && lr.min_energy_kj.zero;
    if(zero!=null){
      // 06.10.2026, andre runde: energy_factor() sammenlignes nå mot
      // SVELLenergien (energySwellKj), ikke totalhøyden - rettet her også
      // (var energyTotalKj, samme feil som selve regelen hadde).
      const broke = good.filter(l=>l.energySwellKj!=null && l.energySwellKj < zero);
      if(broke.length >= LOCAL_RULE_SUGGEST_MIN){
        items.push(`<div class="sugg">${broke.length} gode økter (3+ stjerner) hadde under ${nf0.format(zero)} kJ svellenergi - under "zero"-grensen i den lokale energiregelen. Vurder å senke den. Endres aldri automatisk.</div>`);
      }
    }
    if(lr.tide_prefer && lr.tide_penalty_high!=null){
      const broke = good.filter(l=>l.tideState!=null && !lr.tide_prefer.includes(l.tideState));
      if(broke.length >= LOCAL_RULE_SUGGEST_MIN){
        items.push(`<div class="sugg">${broke.length} gode økter (3+ stjerner) var utenfor tidevannet den lokale regelen favoriserer (${lr.tide_prefer.join("/")}) . Vurder å myke opp tidevanns-straffen. Endres aldri automatisk.</div>`);
      }
    }
    if(!items.length) return "";
    return `<div class="calib"><div class="t">${esc(s.name)}: lokale regler (${esc(lr.source||"lokalkunnskap")})</div>${items.join("")}</div>`;
  }).join("");
  // 06.10.2026, Theodors oppgave (andre runde, punkt 2e): foreslå
  // energy_factor() sine grenser PER SPOT ut fra loggene dine, for ALLE
  // spots (ikke bare de med local_rules fra før) - når en spot har minst
  // ENERGY_LEARN_MIN_LOGS logger med kjent svellenergi, finn energien der
  // loggene går fra flatt/dårlig (0-1 stjerner) til surfbart (2+): "zero" =
  // beste dårlige økt, "full" = dårligste gode økt. Bare et forslag, viser
  // dagens faktiske grenser (standard eller en egen regel) ved siden av -
  // ENDRER ALDRI spots.json selv, samme mønster som alle andre forslag her.
  const ENERGY_LEARN_MIN_LOGS = 8;
  const energyLearnStats = DATA.spots.map(s=>{
    const withE = logs.filter(l=>l.spot===s.id && l.energySwellKj!=null);
    if(withE.length < ENERGY_LEARN_MIN_LOGS) return "";
    const bad = withE.filter(l=>l.stars<=1).map(l=>l.energySwellKj);
    const good = withE.filter(l=>l.stars>=2).map(l=>l.energySwellKj);
    if(!bad.length || !good.length) return "";
    const zero = Math.max(...bad), full = Math.min(...good);
    if(zero >= full) return "";  // ingen tydelig overgang å foreslå - dårlig og god energi overlapper
    const lr = s.local_rules && s.local_rules.min_energy_kj ? s.local_rules.min_energy_kj : null;
    const curTxt = lr ? `${esc(s.name)} sin egen regel (full ${nf0.format(lr.full)}, zero ${nf0.format(lr.zero)})`
                       : `standardgrensene (full 2000, zero 500)`;
    return `<div class="calib"><div class="t">${esc(s.name)}: energiterskel fra ${withE.length} logger</div>
      <p>Dårligste gode økt (2+ stjerner): ${nf0.format(full)} kJ svellenergi. Beste dårlige økt (0-1 stjerne): ${nf0.format(zero)} kJ. Dagens grenser er ${curTxt}. Vurder full ~${nf0.format(full)}, zero ~${nf0.format(zero)}. Endres aldri automatisk.</p></div>`;
  }).join("");
  // ROADMAP oppgave B: treffprosent per antall dager frem, per spot - målt
  // av henteren selv (eldre varsel mot nyeste varsel og mot loggene dine),
  // startverdier ("anslag") til det finnes minst 30 sammenligninger.
  const accuracyStats = DATA.spots.map(s=>{
    const acc = (s.calibration||{}).accuracy;
    if(!acc) return "";
    const measured = acc.filter(a=>a.source==="målt").length;
    const cells = acc.map(a=>`<span class="acc${a.source==="målt"?" malt":""}" title="${a.day} dager frem: ${a.pct} % (${a.source}, ${a.n} sammenligninger)">${a.day}d ${a.pct}%</span>`).join("");
    return `<div class="calib"><div class="t">${esc(s.name)}: ${measured} av 16 dager frem er målt</div>
      <p>Sannsynlighet for treff innenfor én stjerne, per antall dager frem. Uthevet = målt fra dine logger og henterens egne sammenligninger (minst 30), ellers startverdi.</p>
      <div class="accrow">${cells}</div></div>`;
  }).join("");
  const rows = logs.map(l=>{
    const s = DATA.spots.find(x=>x.id===l.spot); const d = new Date(l.t);
    const extra = [l.size,l.wind].filter(Boolean).join(", ");
    const fc = l.forecastStars!=null ? `Varsel: ${l.forecastStars}` : "Uten varsel";
    const obs = l.type==="observed" ? `Observert${l.source?` (${esc(l.source)})`:""}. ` : "";
    return `<div class="logrow"><span><b>${esc(s?s.name:l.spot)}</b> ${starsSVG(l.stars,0)}</span>
      <button class="del" data-id="${l.id}" aria-label="Slett økt ${fmtDate.format(d)}">Slett</button>
      <span class="m">${obs}${fmtDate.format(d)} kl. ${fmtTime.format(d)}. ${fc}${extra?`. ${esc(extra)}`:""}</span></div>`;
  }).join("");
  $("#app").innerHTML = `<header class="top"><h1>Logger</h1><p class="sub">Hver logg gjør varselet ærligere.</p></header>
    <h2 class="sec">Treffsikkerhet</h2>${calib}
    <h2 class="sec">Bølgehøyde</h2>${heightCal}
    <h2 class="sec">Eksponering per retning</h2>${exposureCal}
    <h2 class="sec">BarentsWatch-punkt</h2>${bwCompare}
    <h2 class="sec">Uenige kilder</h2>${disagreeStats}
    ${accuracyStats ? `<h2 class="sec">Treffsikkerhet per dager frem</h2>${accuracyStats}` : ""}
    ${localRuleStats ? `<h2 class="sec">Forslag til lokale regler</h2>${localRuleStats}` : ""}
    ${energyLearnStats ? `<h2 class="sec">Forslag til energiterskler</h2>${energyLearnStats}` : ""}
    <h2 class="sec">Økter</h2>
    <div class="list">${rows || `<p class="empty">Ingen økter ennå. Åpne en spot og trykk Logg økt etter neste tur.</p>`}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="ghost" id="newLog">Logg økt</button></div>`;
  document.querySelectorAll(".del").forEach(b=>b.onclick=()=>{
    const all = loadLogs(); const removed = all.find(l=>l.id===b.dataset.id);
    saveLogs(all.filter(l=>l.id!==b.dataset.id)); markDeleted(b.dataset.id); renderLogs(); syncLogs();
    toast("Økt slettet", "Angre", ()=>{ unmarkDeleted(removed.id); saveLogs([...loadLogs(), removed]); renderLogs(); syncLogs(); });
  });
  $("#newLog").onclick = ()=>openSheet();
}

/* ---------- Synk til privat GitHub-repo ---------- */
const SYNC_KEY = "nordsurf.sync.v1", DEL_KEY = "nordsurf.deleted.v1";
function loadSync(){ try{ return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; }catch(e){ return {}; } }
function saveSync(s){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(s)); }catch(e){} }
function loadDeleted(){ try{ return JSON.parse(localStorage.getItem(DEL_KEY)) || []; }catch(e){ return []; } }
function markDeleted(id){ try{ localStorage.setItem(DEL_KEY, JSON.stringify([...new Set([...loadDeleted(), id])])); }catch(e){} }
function unmarkDeleted(id){ try{ localStorage.setItem(DEL_KEY, JSON.stringify(loadDeleted().filter(x=>x!==id))); }catch(e){} }
const b64 = s => btoa(unescape(encodeURIComponent(s)));
const unb64 = s => decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
let syncing = false;
async function syncLogs(manual){
  const cfg = loadSync();
  if(!cfg.repo || !cfg.token){ if(manual) toast("Legg inn repo og nøkkel først"); return; }
  if(syncing) return; syncing = true;
  const url = `https://api.github.com/repos/${cfg.repo}/contents/logs.json`;
  const headers = {Authorization:`Bearer ${cfg.token}`, Accept:"application/vnd.github+json"};
  try{
    let remote = {logs:[], deleted:[]}, sha;
    const r = await fetch(url,{headers, cache:"no-store"});
    if(r.ok){ const j = await r.json(); sha = j.sha; remote = JSON.parse(unb64(j.content)); }
    else if(r.status!==404) throw new Error(r.status===401?"Nøkkelen er ugyldig eller utløpt":`GitHub svarte ${r.status}`);
    const deleted = [...new Set([...(remote.deleted||[]), ...loadDeleted()])];
    const byId = {};
    [...(remote.logs||[]), ...loadLogs()].forEach(l=>byId[l.id]=l);
    const merged = Object.values(byId).filter(l=>!deleted.includes(l.id));
    const body = JSON.stringify({logs:merged, deleted}, null, 1);
    const put = await fetch(url,{method:"PUT", headers, body: JSON.stringify({message:"Oppdater logger", content:b64(body), ...(sha?{sha}:{})})});
    if(!put.ok) throw new Error(put.status===409?"Konflikt, prøv igjen":`Lagring feilet (${put.status})`);
    saveLogs(merged);
    saveSync({...cfg, last:new Date().toISOString(), error:null});
    if(manual) toast(`Synket ${merged.length} økter`);
  }catch(e){
    saveSync({...cfg, error:e.message});
    if(manual) toast(`Synk feilet: ${e.message}`);
  }finally{
    syncing = false;
    if(state.tab==="innstillinger") renderSettings();
    if(state.tab==="logger") renderLogs();
  }
}
