<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nordsurf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<title>Nordsurf</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/map.css">
</head>
<body>
<div class="shell view-list" id="shell">
  <nav class="tabs" aria-label="Hovedmeny">
    <a class="wm" href="#/" aria-label="Nordsurf, til lista" id="navWordmark"><svg viewBox="0 0 512 512" aria-hidden="true"><path d="M74 318c38-6 56-30 70-56 16-30 34-70 86-70 46 0 68 32 86 64 14 24 30 46 64 50 26 3 44-6 58-16" fill="none" stroke="currentColor" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/><path d="M74 402c38-6 56-26 70-44 10-13 22-28 40-28" fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><circle cx="392" cy="150" r="30" fill="currentColor"/></svg></a>
    <button class="tab" data-tab="varsel" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2 16c2.2 0 2.2-1.6 4.4-1.6S8.6 16 10.8 16s2.2-1.6 4.4-1.6S17.4 16 19.6 16 22 14.4 22 14.4V18c0 .2-.2 1.6-2.4 1.6s-2.2-1.6-4.4-1.6-2.2 1.6-4.4 1.6S8.6 18 6.4 18 4.2 19.6 2 19.6zM4 12.5C4 8.4 7.4 5 11.5 5c2.4 0 4.6 1.2 6 3-3-.8-6.2.6-7.5 3.5-.6 1.3-.8 2.4-.8 3.2-1.4-.5-3.3-.8-5.2-.9 0-.1 0-.2 0-.3z"/></svg>
      Varsel
    </button>
    <button class="tab" data-tab="kart">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M12 2c4.42 0 8 3.58 8 8 0 5.25-6.72 11.19-7.19 11.6a1 1 0 0 1-1.62 0C10.72 21.19 4 15.25 4 10c0-4.42 3.58-8 8-8zm0 5.5A2.5 2.5 0 1 0 12 12.5 2.5 2.5 0 0 0 12 7.5z"/></svg>
      Kart
    </button>
    <button class="tab" data-tab="logger">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 3h11l3 3v15H5zm2 2v14h10V7h-2V5zm2 5h6v2H9zm0 4h6v2H9z"/></svg>
      Logger
    </button>
    <button class="tab" data-tab="innstillinger">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.6 4.8-1.9-.3a7 7 0 0 1-.6 1.5l1.1 1.6-1.7 1.7-1.6-1.1a7 7 0 0 1-1.5.6l-.3 1.9h-2.4l-.3-1.9a7 7 0 0 1-1.5-.6l-1.6 1.1-1.7-1.7 1.1-1.6a7 7 0 0 1-.6-1.5l-1.9-.3v-2.4l1.9-.3a7 7 0 0 1 .6-1.5L5.1 6.8l1.7-1.7 1.6 1.1a7 7 0 0 1 1.5-.6l.3-1.9h2.4l.3 1.9a7 7 0 0 1 1.5.6l1.6-1.1 1.7 1.7-1.1 1.6a7 7 0 0 1 .6 1.5l1.9.3z"/></svg>
      Innstillinger
    </button>
  </nav>
  <main class="pane" id="listPane" aria-label="Spotliste"></main>
  <section class="pane" id="detailPane" aria-live="polite" aria-label="Detaljer" hidden></section>
  <div id="mapRoot" hidden></div>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheet-head">
    <button class="link" id="cancelLog">Avbryt</button>
    <h2 id="sheetTitle">Logg økt</h2>
    <span class="spacer"></span>
  </div>
  <div class="field"><p class="lbl">Spot</p><select id="logSpot"></select></div>
  <div class="field"><p class="lbl">Når</p><input type="datetime-local" id="logTime">
    <div class="photo-row"><button type="button" class="ghost" id="logFromPhotoBtn">Fra bilde</button><span class="caption">Tidspunktet hentes fra bildet. Bildet lagres ikke.</span></div>
    <input type="file" accept="image/*" id="logPhotoInput" hidden>
  </div>
  <div class="field"><p class="lbl">Type</p><div class="chips excl" data-group="type"></div></div>
  <div class="field" id="sourceField" hidden><p class="lbl">Kilde (valgfritt)</p><input type="text" id="logSource" placeholder="f.eks. Instagram, Lofoten Surfsenter"></div>
  <div class="field"><p class="lbl">Hvor bra var det?</p><div class="starpick" id="starPick"></div></div>
  <div class="field"><p class="lbl">Størrelse (valgfritt)</p><div class="chips" data-group="size"></div></div>
  <div class="field"><p class="lbl">Vind (valgfritt)</p><div class="chips" data-group="wind"></div></div>
  <button class="primary save" id="saveLog" disabled>Lagre økt</button>
</section>
<div class="scrim" id="bdScrim"></div>
<section class="sheet" id="bdSheet" role="dialog" aria-modal="true" aria-labelledby="bdTitle" aria-hidden="true">
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheet-head">
    <span class="spacer"></span>
    <h2 id="bdTitle">Hvorfor denne ratingen?</h2>
    <button class="link" id="bdClose">Lukk</button>
  </div>
  <div class="breakdown" id="bdBody"></div>
</section>
<div class="scrim" id="exScrim"></div>
<section class="sheet" id="exSheet" role="dialog" aria-modal="true" aria-labelledby="exTitle" aria-hidden="true">
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheet-head">
    <span class="spacer"></span>
    <h2 id="exTitle"></h2>
    <button class="link" id="exClose">Lukk</button>
  </div>
  <div id="exBody"></div>
</section>
<div class="scrim" id="witnessScrim"></div>
<section class="sheet" id="witnessSheet" role="dialog" aria-modal="true" aria-labelledby="witnessTitle" aria-hidden="true">
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheet-head">
    <button class="link" id="witnessSkip">Ikke jeg</button>
    <h2 id="witnessTitle">Var du der?</h2>
    <span class="spacer"></span>
  </div>
  <p class="sub" id="witnessSub"></p>
  <div class="starpick" id="witnessPick"></div>
</section>
<div class="toast" id="toast" role="status"></div>

<script src="js/strings.js"></script>
<script src="js/wordmark.js"></script>
<script src="js/explain.js"></script>
<script src="js/chart.js"></script>
<script src="js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/map.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
