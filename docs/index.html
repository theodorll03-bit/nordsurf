<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1822">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nordsurf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<title>Nordsurf</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/kart.css">
</head>
<body>
<div class="stage" id="stage">
  <div class="kart" id="kart" aria-label="Kart over spots"></div>
  <p class="loading" id="loading">Henter varselet …</p>
  <header class="top-bar">
    <div class="brand"><a class="wm" href="#/" id="wordmark" aria-label="Nordsurf, til kartet"></a><span class="upd" id="updated"></span></div>
    <div class="top-btns">
      <button type="button" class="icon-btn" id="btnLogg" aria-label="Logg økt" title="Logg økt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      <button type="button" class="icon-btn" id="btnLogger" aria-label="Logger" title="Logger"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 3h11l3 3v15H5zm2 2v14h10V7h-2V5zm2 5h6v2H9zm0 4h6v2H9z"/></svg></button>
      <button type="button" class="icon-btn" id="btnSettings" aria-label="Innstillinger" title="Innstillinger"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.6 4.8-1.9-.3a7 7 0 0 1-.6 1.5l1.1 1.6-1.7 1.7-1.6-1.1a7 7 0 0 1-1.5.6l-.3 1.9h-2.4l-.3-1.9a7 7 0 0 1-1.5-.6l-1.6 1.1-1.7-1.7 1.1-1.6a7 7 0 0 1-.6-1.5l-1.9-.3v-2.4l1.9-.3a7 7 0 0 1 .6-1.5L5.1 6.8l1.7-1.7 1.6 1.1a7 7 0 0 1 1.5-.6l.3-1.9h2.4l.3 1.9a7 7 0 0 1 1.5.6l1.6-1.1 1.7 1.7-1.1 1.6a7 7 0 0 1 .6 1.5l1.9.3z"/></svg></button>
    </div>
    <div class="seg" role="group" aria-label="Område">
      <button type="button" data-view="nord" aria-pressed="true">Troms</button>
      <button type="button" data-view="lofoten" aria-pressed="false">Lofoten</button>
      <button type="button" data-view="alle" aria-pressed="false">Alle</button>
    </div>
  </header>
  <div class="legend" aria-label="Fargene">
    <span class="r-1"><i></i>Dårlig</span><span class="r-2"><i></i>Ok</span><span class="r-3"><i></i>Bra</span><span class="r-4"><i></i>Veldig bra</span><span class="r-5"><i></i>Rått</span>
    <span class="hint">Strekene på kartet viser vinden</span>
  </div>
  <section class="ark" id="ark" aria-label="Varsel">
    <button type="button" class="ark-handle" aria-label="Vis alle spots"><span></span></button>
    <div id="banners"></div>
    <div class="ark-head">
      <div class="time">
        <button type="button" class="play" id="play" aria-label="Spill av varselet"></button>
        <div class="time-text"><div class="t"><span id="timeT"></span><span class="now" id="timeNow">Nå</span></div><span class="l" id="timeL"></span></div>
      </div>
      <input type="range" class="range" id="tid" min="0" max="0" step="1" value="0" aria-label="Velg tidspunkt">
      <div class="ticks" id="ticks" aria-hidden="true"></div>
    </div>
    <div class="ark-scroll">
      <div class="page peek" id="peek" data-page="peek"></div>
      <div class="page rows" id="list" data-page="list"></div>
      <div class="page spot" id="spot" data-page="spot"></div>
      <div class="page" data-page="side"><div class="pagebar" id="pageBar"></div><section class="pane" id="detailPane" aria-live="polite"></section></div>
    </div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheet-head">
    <button class="link" id="cancelLog">Avbryt</button>
    <h2 id="sheetTitle">Logg økt</h2>
    <span class="spacer"></span>
  </div>
  <div class="field"><p class="lbl">Spot</p><select id="logSpot"></select></div>
  <div class="field"><p class="lbl">Når</p><input type="datetime-local" id="logTime" lang="nb"><p class="hint" id="logTimeText" aria-live="polite"></p>
    <div class="photo-row"><button type="button" class="ghost" id="logFromPhotoBtn">Fra bilde</button><span class="caption">Tidspunktet hentes fra bildet. Bildet lagres ikke.</span></div>
    <input type="file" accept="image/*" id="logPhotoInput" hidden>
  </div>
  <div class="field"><p class="lbl">Type</p><div class="chips excl" data-group="type"></div></div>
  <div class="field" id="sourceField" hidden><p class="lbl">Kilde (valgfritt)</p><input type="text" id="logSource" placeholder="f.eks. Instagram, Lofoten Surfsenter"></div>
  <div class="field"><p class="lbl">Hvor bra var det?</p><div class="starpick" id="starPick"></div></div>
  <div class="field"><p class="lbl">Størrelse (valgfritt)</p><div class="chips" data-group="size"></div></div>
  <div class="field"><p class="lbl">Vind (valgfritt)</p><div class="chips" data-group="wind"></div></div>
  <button class="primary save" id="saveLog" disabled>Lagre økt</button>
</section>
<div class="scrim" id="bdScrim"></div>
<section class="sheet" id="bdSheet" role="dialog" aria-modal="true" aria-labelledby="bdTitle" aria-hidden="true">
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheet-head">
    <span class="spacer"></span>
    <h2 id="bdTitle">Hvorfor denne ratingen?</h2>
    <button class="link" id="bdClose">Lukk</button>
  </div>
  <div class="breakdown" id="bdBody"></div>
</section>
<div class="scrim" id="exScrim"></div>
<section class="sheet" id="exSheet" role="dialog" aria-modal="true" aria-labelledby="exTitle" aria-hidden="true">
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheet-head">
    <span class="spacer"></span>
    <h2 id="exTitle"></h2>
    <button class="link" id="exClose">Lukk</button>
  </div>
  <div id="exBody"></div>
</section>
<div class="scrim" id="witnessScrim"></div>
<section class="sheet" id="witnessSheet" role="dialog" aria-modal="true" aria-labelledby="witnessTitle" aria-hidden="true">
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheet-head">
    <button class="link" id="witnessSkip">Ikke jeg</button>
    <h2 id="witnessTitle">Var du der?</h2>
    <span class="spacer"></span>
  </div>
  <p class="sub" id="witnessSub"></p>
  <div class="starpick" id="witnessPick"></div>
</section>
<div class="toast" id="toast" role="status"></div>

<script src="js/strings.js"></script>
<script src="js/wordmark.js"></script>
<script src="js/explain.js"></script>
<script src="js/app.js"></script>
<script src="js/kart.js"></script>
<script src="js/front.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
